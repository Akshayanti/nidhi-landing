<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Roboto', sans-serif;
    background: #0D47A1;
    color: #FFFFFF;
  }

  .slide {
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 36px 64px 48px;
    position: relative;
  }

  /* Teal accent bar at top */
  .slide::before {
    content: '';
    position: absolute;
    top: 0;
    left: 64px;
    right: 64px;
    height: 4px;
    background: #00897B;
    border-radius: 0 0 2px 2px;
  }

  /* --- First slide (hook/title) --- */
  .slide.slide-first {
    justify-content: center;
    text-align: center;
    padding: 72px 64px 72px;
  }

  .slide.slide-first .content {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 68px;
    line-height: 1.18;
    letter-spacing: -0.02em;
  }

  .slide.slide-first .handle {
    position: absolute;
    bottom: 80px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: #4EBAAA;
  }

  /* --- Middle slides (and last slide) --- */
  .slide.slide-middle .content {
    font-family: 'Roboto', sans-serif;
    font-weight: 400;
    font-size: 54px;
    line-height: 1.28;
  }

  /* Lists in content */
  .content ul, .content ol {
    margin-left: 0.8em;
    margin-top: 0.15em;
  }

  .content li {
    margin-bottom: 0.1em;
    line-height: 1.35;
  }

  /* Bold text */
  .content strong {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 1.15em;
    color: #4EBAAA;
  }

  /* Teal accent for secondary emphasis */
  .content em {
    font-style: normal;
    color: #4EBAAA;
  }

  /* --- Bottom bar --- */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 64px;
    background: rgba(0, 0, 0, 0.15);
  }

  .brand {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: #4EBAAA;
  }

  .slide-counter {
    position: absolute;
    right: 64px;
    font-family: 'Roboto', sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: #FFFFFF;
    opacity: 0.6;
  }

</style>
</head>
<body>
  <div id="slide" class="slide">
    <div class="content" id="content"></div>
    <div class="bottom-bar">
      <span class="brand" id="brand-link">https://nidhi.today/</span>
      <span class="slide-counter" id="counter"></span>
    </div>
  </div>
</body>
</html>
