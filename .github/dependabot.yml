version: 2

updates:
  # Root npm project (the Astro site itself). Grouping minor/patch bumps
  # into one PR per run keeps routine updates from piling up the way 17
  # separate "Bump X from Y to Z" PRs did before this file existed; major
  # bumps (framework/runtime-level changes that need real compatibility
  # testing, e.g. an astro 6->7 jump) are excluded from the group so each
  # still gets its own PR and review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          # Pre-1.0 packages: by semver convention a "minor" bump on a
          # 0.x version (e.g. 0.32.x -> 0.128.x) can be a breaking change,
          # but Dependabot's update-type classifier doesn't know that and
          # will happily fold it into this "safe" group alongside genuine
          # patch bumps. Confirmed the hard way: a grouped PR bundled
          # @anthropic-ai/sdk 0.32.1 -> 0.128.0 (96 minor versions, used
          # in scripts/lib/llm-script-writer.mjs) with two actually-safe
          # patches, and src/utils/dependencies.test.ts's version-snapshot
          # guard correctly failed the PR. Excluding it here means it
          # still gets proposed (see the ignore rule below), just on its
          # own, not silently bundled with things that are safe to merge
          # on sight.
          - "@anthropic-ai/sdk"
    ignore:
      # Same 0.x reasoning as above: only propose patch bumps
      # automatically. A minor-version bump on this SDK needs a human to
      # read the changelog and check scripts/lib/llm-script-writer.mjs
      # still calls a valid API before it ships, so don't auto-open a PR
      # implying it's routine.
      - dependency-name: "@anthropic-ai/sdk"
        update-types: ["version-update:semver-minor"]

  # The remotion/ subdirectory has its own package.json and lockfile
  # (video/reel rendering pipeline), separate from the root project.
  - package-ecosystem: "npm"
    directory: "/remotion"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions pinned in .github/workflows/*.yml. Grouped
  # (including majors, unlike the npm groups above): Actions releases are
  # simple version-tag bumps almost all the time, breaking runtime changes
  # are rare and loud (they show up as an immediate workflow failure on
  # the next run, not a silent regression), and the first daily scan after
  # this file was added opened 5 separate PRs for exactly this reason.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
