version: 2

updates:
  # Root npm project (the Astro site itself). Grouping minor/patch bumps
  # into one PR per run keeps routine updates from piling up the way 17
  # separate "Bump X from Y to Z" PRs did before this file existed; major
  # bumps (framework/runtime-level changes that need real compatibility
  # testing, e.g. an astro 6->7 jump) are excluded from the group so each
  # still gets its own PR and review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The remotion/ subdirectory has its own package.json and lockfile
  # (video/reel rendering pipeline), separate from the root project.
  - package-ecosystem: "npm"
    directory: "/remotion"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The Python packages the newsletter send and its tests install
  # (scripts/requirements.txt, exact versions). They were lower bounds
  # written by hand in two workflows, so a new jinja2 or beautifulsoup4
  # reached the newsletter send the day it was released, with no pull
  # request (#317). Majors come one at a time, as for npm.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions in .github/workflows/*.yml. Each `uses:` is pinned to a
  # full commit SHA with the release in a trailing comment (#316);
  # Dependabot moves the SHA and the comment together. Grouped
  # (including majors, unlike the npm groups above): Actions releases are
  # simple version-tag bumps almost all the time, breaking runtime changes
  # are rare and loud (they show up as an immediate workflow failure on
  # the next run, not a silent regression), and the first daily scan after
  # this file was added opened 5 separate PRs for exactly this reason.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
