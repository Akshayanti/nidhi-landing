name: Free tools suite

# The jobs of the three free tools checks, written once: the privacy check,
# mutation testing and the text-size audit. This file starts nothing by
# itself. It is called with the suite to run:
#
#   - by PR Checks (pr-checks.yml), on every pull request, once the pull
#     request checks and the build have passed: the three suites side by
#     side, each as one leg of the tool stage;
#   - by tool-privacy.yml, tool-mutation.yml and tool-text-size.yml, for the
#     nightly runs, the runs by hand and (mutation only) every merge to main.
#
# Only the jobs of the suite asked for run; the others report "skipped". A
# suite this file does not know fails (the first job below), so a misspelt
# suite can never pass by running nothing.
#
# Called this way, `github` is the caller's: `github.event_name` is
# pull_request in a pull request's run, schedule in a nightly one, push for a
# merge to main and workflow_dispatch for a run by hand (PR Checks' own manual
# run included), and `github.run_id` is the caller's run. Every condition
# below means what it meant when these jobs were workflows of their own.
#
# On a pull request one failure stops everything: each worker matrix is
# fail-fast there, so a failed tool or shard cancels the rest of its suite,
# the failure ends this suite's leg of the tool stage, and the tool stage
# (fail-fast too) cancels the other two suites. Nightly and manual runs let
# every job report, as before. No concurrency group here: the caller's
# decides what a newer run cancels.
#
# The summary jobs are not the required checks: PR Checks has its own jobs
# with the required names, which pass only when the whole tool stage
# succeeded. Each summary job decides its suite: it fails unless every job of
# the suite passed, or the plan said there was nothing to check.
on:
  workflow_call:
    inputs:
      suite:
        description: 'The suite to run: privacy, mutation or text-size'
        required: true
        type: string

# The jobs only read the code. The nightly alerts, which write issues, are in
# the three calling workflows, so nothing here can write anything.
permissions:
  contents: read

# Install scripts: every `npm ci` here fails if a dependency has an install
# script that the project's package.json `allowScripts` does not cover (for
# example a puppeteer bump whose pinned approval has not been updated). Only
# CI is strict: in .npmrc it would stop Dependabot from opening those PRs at
# all. See README "Install scripts". (A caller's `env` does not reach a
# called workflow, so this file sets it itself.)
env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'

jobs:
  # Runs only for a suite this file does not know, and fails: every other
  # job would be skipped, and a run of nothing would succeed.
  known-suite:
    if: ${{ !contains(fromJSON('["privacy", "mutation", "text-size"]'), inputs.suite) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The suite is one this file knows
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          echo "::error::Unknown suite \"$SUITE\": expected privacy, mutation or text-size."
          exit 1

  # ===========================================================================
  # Privacy: CLAUDE.md, "Free tools keep inputs out of URLs", rule 6. Nothing
  # a reader types into a free tool may reach PostHog. It uses every free
  # tool in a real browser, in every language, on a phone-sized and a
  # laptop-sized window, with cookie consent declined and accepted, and reads
  # every request the page tries to send to PostHog
  # (scripts/verify-tool-privacy.mjs).
  #
  # Nothing reaches PostHog. The build carries a dummy key that PostHog
  # rejects (PUBLIC_ANALYTICS_TEST=1), the script answers PostHog's settings
  # request itself, aborts every other request to PostHog, and starts Chrome
  # unable to resolve the ingestion host. Only the SDK's static scripts are
  # downloaded.
  #
  # The run needs a window: PostHog does not send $pageleave from a headless
  # browser, so Chrome runs under xvfb.
  # ===========================================================================

  # A pull request that changes only files the build and the check never read
  # (scripts/lib/checks/check-inputs.mjs: docs, agent files, other workflows,
  # the two root notes) builds the same site main already has, so the check
  # is skipped and the summary job passes in that one case. Nightly and
  # manual runs always check everything.
  privacy-plan:
    if: inputs.suite == 'privacy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.inputs.outputs.run || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base as well (HEAD^1 of the merge commit), to list what the
          # pull request changes.
          fetch-depth: 2

      - name: Whether the pull request can change what the check sees
        id: inputs
        if: github.event_name == 'pull_request'
        # Both ends of a move (--no-renames), NUL-separated (-z) so no name
        # is quoted or split. Anything but a clear "false" checks every tool.
        run: |
          run=true
          if git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"; then
            run=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { changedPaths, needsRun } from "./scripts/lib/checks/check-inputs.mjs";
              process.stdout.write(String(needsRun(changedPaths(readFileSync(process.argv[1], "utf8")), process.argv[2])));
            ' "$RUNNER_TEMP/changed" ".github/workflows/tool-privacy.yml") || run=true
          fi
          [ "$run" = "false" ] || run=true
          if [ "$run" = "false" ]; then echo "Only files the check never reads changed: the tools are skipped."; else echo "Every tool is checked."; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # One job per tool: the same hundred runs as one long job (every tool,
  # language, window size and consent state), in less time. Each job is
  # whole in itself: its own test build, the planted leak for its tool, then
  # that tool's twenty runs, both window sizes among them, so the script's
  # rule that a tool shows both a rage click and a dead click across its runs
  # still applies. The list is every tool under src/pages/free; a unit test
  # (scripts/lib/checks/tool-privacy-checks.test.mjs) fails when a tool is
  # missing here.
  privacy-tool:
    name: 'Privacy check: ${{ matrix.tool }}'
    needs: privacy-plan
    if: ${{ !cancelled() && needs.privacy-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # On a pull request a leak in one tool cancels the others: the pull
      # request cannot merge either way. Nightly and by hand every tool
      # reports, so one leak does not hide another.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      # Five tools at a time (owner, 2026-11-25). While it runs, mutation
      # waits for runners beyond the account's 20 (its cap, 18, is set for
      # after this suite and the other have finished).
      max-parallel: 5
      matrix:
        tool:
          - loan-comparison
          - multi-currency-net-worth
          - monte-carlo-simulator
          - inflation-calculator
          - invest-or-pay-off
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # A test build: analytics run on localhost with a key PostHog rejects.
      # No real key is ever given to this workflow.
      - name: Build (test build)
        run: npm run build
        env:
          PUBLIC_ANALYTICS_TEST: '1'

      # The check checking itself: with a typed amount planted in an event,
      # every run must fail. A check that cannot fail proves nothing.
      - name: The check catches a planted leak
        run: xvfb-run -a node scripts/verify-tool-privacy.mjs --plant-leak --tool ${{ matrix.tool }} --locale en --viewport laptop --jobs 2 --dump tool-privacy-payloads

      - name: Every language, window size and consent state
        run: xvfb-run -a node scripts/verify-tool-privacy.mjs --tool ${{ matrix.tool }} --jobs 3 --dump tool-privacy-payloads

      # The decoded payloads of a failed run, to see what was sent. They hold
      # only the test's own made-up values. The name starts with this suite's
      # own prefix, which the mutation suite's download (mutation-*) never
      # matches, though both suites run in one PR Checks run.
      - name: Keep the payloads of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-privacy-payloads-${{ matrix.tool }}
          path: tool-privacy-payloads
          retention-days: 7
          if-no-files-found: ignore

  # The privacy suite's result: it passes only when every tool's job passed.
  #
  # `always()` matters: a skipped job counts as a pass. Without a status
  # function GitHub skips this job when a job it needs has failed, and
  # `!cancelled()` skips it when the run is cancelled before it starts;
  # either way a leak would read as a pass. With `always()` it runs every
  # time the privacy suite is asked for, and passes only when every tool's
  # job succeeded.
  privacy-gate:
    name: No typed value reaches analytics
    needs: [privacy-plan, privacy-tool]
    if: ${{ always() && inputs.suite == 'privacy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every tool's check passed
        env:
          PLAN: ${{ needs.privacy-plan.result }}
          RUN: ${{ needs.privacy-plan.outputs.run }}
          TOOLS: ${{ needs.privacy-tool.result }}
        run: |
          echo "plan: $PLAN (run: $RUN), tools: $TOOLS"
          # A pull request that changes nothing the check reads: the plan said
          # so, and nothing ran. Only that exact case passes without the check.
          if [ "$PLAN" = "success" ] && [ "$RUN" = "false" ] && [ "$TOOLS" = "skipped" ]; then
            echo "Nothing the check reads changed: nothing to check."
            exit 0
          fi
          if [ "$PLAN" != "success" ] || [ "$TOOLS" != "success" ]; then
            echo "::error::A tool's privacy check did not pass (or did not run). See the 'Privacy check: <tool>' jobs."
            exit 1
          fi

  # ===========================================================================
  # Mutation testing of the free tools (#790, #846). StrykerJS
  # (stryker.config.mjs) mutates every tool's logic and component, and the
  # code they share; each scope's logic and component are held on their own
  # (never pooled) to their floors in stryker.floors.json: the score measured
  # when the gates landed, raised to 95 in each scope's own pull request,
  # never lowered. A slow scope runs as several shards (stryker.shards.json),
  # and a pull request retests only the mutants its changes reach, reusing
  # the results of the last run on main; the nightly run retests everything.
  #
  # A pull request that changes only files no mutation run reads
  # (scripts/lib/checks/check-inputs.mjs: docs/, .claude/, other workflows,
  # README.md, CLAUDE.md) skips the shards and the floors, and the gate
  # passes because the plan job said so, never because a job was skipped
  # (owner, Nov 23, 2026). When the plan cannot tell, everything runs.
  # Nightly and manual runs always run everything.
  # ===========================================================================

  # The mutation shards to run, from stryker.shards.json: a slow scope runs
  # on several runners (#846). And whether to run them: a pull request or a
  # merge that changes no mutation input does not (`run` is 'false').
  mutation-plan:
    if: inputs.suite == 'mutation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read only: on a push, which pull request the commit came from, that
    # pull request's runs, their jobs and artifacts (below).
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      run: ${{ steps.reuse.outputs.run || steps.inputs.outputs.run || steps.pushed.outputs.run || 'true' }}
      seed: ${{ steps.reuse.outputs.seed }}
      trace: ${{ steps.trace.outputs.trace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base as well (HEAD^1 of the merge commit), to list what the
          # pull request changes.
          fetch-depth: 2

      - name: Whether the pull request can change a score
        id: inputs
        if: github.event_name == 'pull_request'
        # Both ends of a move (--no-renames), NUL-separated (-z) so no name
        # is quoted or split. Anything but a clear "false" runs every shard.
        run: |
          run=true
          if git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"; then
            run=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { changedPaths, needsRun } from "./scripts/lib/checks/check-inputs.mjs";
              process.stdout.write(String(needsRun(changedPaths(readFileSync(process.argv[1], "utf8")), process.argv[2])));
            ' "$RUNNER_TEMP/changed" ".github/workflows/tool-mutation.yml") || run=true
          fi
          [ "$run" = "false" ] || run=true
          if [ "$run" = "false" ]; then echo "Only files no mutation run reads changed: the shards are skipped."; else echo "Every shard runs."; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # Whether the pull request changes the dependency analysis or its
      # trace (#891, council round 2): then the trace job runs on it too.
      - name: Whether the pull request changes the dependency analysis
        id: trace
        if: github.event_name == 'pull_request'
        run: |
          trace=false
          if git diff --name-only --no-renames HEAD^1 HEAD | grep -Eqx 'scripts/lib/checks/mutation-deps\.mjs|scripts/lib/checks/trace-deps-hook\.mjs|scripts/check-mutation-deps\.mjs'; then trace=true; fi
          echo "trace=$trace" >> "$GITHUB_OUTPUT"

      # The same question for a merge to main (tool-mutation.yml's push
      # run): what the push changed, from the commit main was at before it.
      # A first push, a forced one or a commit that cannot be fetched runs
      # every shard.
      - name: Whether the push can change a score
        id: pushed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if echo "$BEFORE" | grep -Eqx '[0-9a-f]{40}' && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git fetch --quiet --depth=1 origin "$BEFORE" \
            && git diff --name-only --no-renames -z "$BEFORE" HEAD > "$RUNNER_TEMP/changed"; then
            run=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { changedPaths, needsRun } from "./scripts/lib/checks/check-inputs.mjs";
              process.stdout.write(String(needsRun(changedPaths(readFileSync(process.argv[1], "utf8")), process.argv[2])));
            ' "$RUNNER_TEMP/changed" ".github/workflows/tool-mutation.yml") || run=true
          fi
          [ "$run" = "false" ] || run=true
          if [ "$run" = "false" ]; then echo "Only files no mutation run reads changed: the shards are skipped."; else echo "Every shard runs."; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # What every shard's earlier results depend on, once for all shards
      # (scripts/lib/checks/mutation-fingerprint.mjs): every tracked file
      # outside src/ that a mutation run reads (the dependencies, Node,
      # Stryker's settings, the runner, the test helpers, the workflows).
      # The code under src/ is fingerprinted per test file in each shard
      # instead (#891, mutation-deps.mjs). A failure here fails the plan, and
      # with it the gate.
      - name: The fingerprint of what the shards run on
        id: fingerprint
        run: |
          git ls-files -z > "$RUNNER_TEMP/tracked"
          fingerprint=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { fingerprint, trackedPaths } from "./scripts/lib/checks/mutation-fingerprint.mjs";
            process.stdout.write(fingerprint(trackedPaths(readFileSync(process.argv[1], "utf8")), (path) => readFileSync(path)));
          ' "$RUNNER_TEMP/tracked")
          echo "$fingerprint" | grep -Eqx '[0-9a-f]{64}'
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: List the shards
        id: shards
        run: |
          node -e '
            const shards = JSON.parse(require("fs").readFileSync("stryker.shards.json", "utf8"));
            const list = Object.entries(shards).flatMap(([scope, n]) =>
              Array.from({ length: n }, (_, i) => ({ scope, shard: i + 1, of: n, name: n === 1 ? scope : `${scope}-${i + 1}of${n}` })));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `shards=${JSON.stringify(list)}\n`);
          '

      # What this pull request's run tests, for the merge to main to compare
      # with (scripts/lib/checks/mutation-reuse.mjs): an artifact whose name
      # holds the tested tree (the merge ref's), its base tree and the
      # fingerprint. Its content is the same three, for a reader.
      - name: Note what this run tests
        id: manifest
        if: github.event_name == 'pull_request'
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          base=$(git rev-parse 'HEAD^1^{tree}')
          name=$(node --input-type=module -e '
            import { manifestName } from "./scripts/lib/checks/mutation-reuse.mjs";
            process.stdout.write(manifestName({ tree: process.argv[1], baseTree: process.argv[2], fingerprint: process.argv[3] }));
          ' "$tree" "$base" "$FINGERPRINT")
          mkdir -p "$RUNNER_TEMP/manifest"
          printf 'tree %s\nbase %s\nfingerprint %s\n' "$tree" "$base" "$FINGERPRINT" > "$RUNNER_TEMP/manifest/manifest.txt"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Keep the note
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.manifest.outputs.name }}
          path: ${{ runner.temp }}/manifest/manifest.txt
          retention-days: 7
          if-no-files-found: error

      # A merge to main: a pull request's cache cannot be read from main, so
      # without this the push run would test again exactly what the pull
      # request's last run tested. When that run counts (mutation-reuse.mjs
      # says when), no shard runs here, the gate passes because the plan says
      # so, and mutation-seed copies each shard's results into main's cache.
      # Anything it cannot read or check runs every shard, as before.
      - name: Whether the pull request's last run already tested this code
        id: reuse
        if: github.event_name == 'push' && steps.pushed.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SHARDS: ${{ steps.shards.outputs.shards }}
        run: |
          dir="$RUNNER_TEMP/reuse"
          mkdir -p "$dir"
          tree=$(git rev-parse 'HEAD^{tree}')
          base=$(git rev-parse 'HEAD^1^{tree}' 2>/dev/null || echo none)
          if ! gh api "repos/$REPO/commits/$SHA/pulls" > "$dir/pulls.json"; then echo "The pull request could not be read: every shard runs."; exit 0; fi
          head=$(node -e 'const p = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const m = Array.isArray(p) ? p.filter((x) => x && x.merged_at) : []; process.stdout.write(m.length === 1 && /^[0-9a-f]{40}$/.test(m[0].head?.sha ?? "") ? m[0].head.sha : "")' "$dir/pulls.json")
          if [ -z "$head" ]; then echo "No single merged pull request leads here: every shard runs."; exit 0; fi
          if ! gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100" > "$dir/runs.json"; then echo "The runs could not be read: every shard runs."; exit 0; fi
          run=$(node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).workflow_runs ?? []; const o = r.filter((x) => x.path === ".github/workflows/pr-checks.yml").sort((a, b) => b.run_number - a.run_number || b.id - a.id)[0]; process.stdout.write(o ? `${o.id} ${o.run_attempt}` : "")' "$dir/runs.json")
          if [ -n "$run" ]; then
            set -- $run
            gh api "repos/$REPO/actions/runs/$1/attempts/$2/jobs?per_page=100" > "$dir/jobs-$1-$2.json" || true
            gh api "repos/$REPO/actions/runs/$1/artifacts?per_page=100" > "$dir/artifacts-$1.json" || true
          fi
          node --input-type=module -e '
            import { existsSync, readFileSync, appendFileSync } from "node:fs";
            import { decideReuse } from "./scripts/lib/checks/mutation-reuse.mjs";
            const [dir, repo, tree, baseTree, fingerprint, shardsJson] = process.argv.slice(1);
            const read = (f) => { try { return existsSync(f) ? JSON.parse(readFileSync(f, "utf8")) : null; } catch { return null; } };
            const answer = decideReuse({
              repo, tree, baseTree, fingerprint,
              pulls: read(`${dir}/pulls.json`),
              runs: read(`${dir}/runs.json`),
              jobsOf: (id, attempt) => read(`${dir}/jobs-${id}-${attempt}.json`),
              artifactsOf: (id) => read(`${dir}/artifacts-${id}.json`),
              shards: JSON.parse(shardsJson).map((s) => s.name),
            });
            console.log(`${answer.reuse ? "Taken" : "Not taken"}: ${answer.reason}.`);
            if (answer.reuse) appendFileSync(process.env.GITHUB_OUTPUT, `run=false\nseed=${answer.runId}\n`);
          ' "$dir" "$REPO" "$tree" "$base" "$FINGERPRINT" "$SHARDS"

  mutation-shard:
    name: 'Mutation: ${{ matrix.name }}'
    needs: mutation-plan
    if: ${{ !cancelled() && needs.mutation-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # On a pull request a failed shard cancels the others: the pull request
      # cannot merge either way, and each cancelled shard still keeps what it
      # had finished (below). Nightly, by hand and on a merge to main every
      # shard reports, so one weak tool does not hide another.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      # Up to eighteen shards at a time (owner, 2026-11-25). A cap cannot
      # grow while a run goes on, so this one is set for when privacy and
      # text size (five each) have finished: until then the three suites ask
      # for 28 runners, GitHub gives the account 20 at most and queues the
      # rest, and this pull request can take every runner. Afterwards
      # mutation uses 18 and 2 stay free.
      max-parallel: 18
      matrix:
        include: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base as well, for the tests that compare with it, as in the
          # Tests job of pr-checks.yml: the first test run runs every test.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The shard's earlier results (incremental mode, #846): a run starts
      # from the latest results saved under the same fingerprint (this pull
      # request's own, or main's) and retests only mutants whose code or
      # tests changed. Stryker compares the code it mutates and the test
      # files, and nothing else. What every result depends on (the
      # dependencies, its own settings, the shards, Node, the test helpers)
      # is in the plan job's fingerprint: a change to any of it starts the
      # shard afresh. What one test file reaches (the code it imports, the
      # data it reads) is in that file's own fingerprint, saved beside the
      # results (#891): the step below makes Stryker see a test file whose
      # fingerprint changed as changed, so only its mutants are tested again.
      # The nightly run retests everything (STRYKER_FORCE) and saves afresh.
      # The key holds the caller's run id and attempt, so no two runs, or
      # attempts, ever save under one key.
      #
      # The results travel with the dependency fingerprints they were saved
      # with (#891), the same two paths wherever they are restored or saved:
      # the paths are part of a cache's version, so another list would never
      # match.
      - name: Earlier results
        id: earlier
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/stryker-incremental/${{ matrix.name }}.json
            reports/stryker-incremental/${{ matrix.name }}.deps.json
          key: stryker-incremental-${{ matrix.name }}-${{ needs.mutation-plan.outputs.fingerprint }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stryker-incremental-${{ matrix.name }}-${{ needs.mutation-plan.outputs.fingerprint }}-

      # Before anything else, the test files whose dependencies changed since
      # the results were saved are marked, so Stryker treats them as edited,
      # and today's dependency fingerprints are written beside the results
      # (scripts/lib/checks/mutation-deps.mjs). The note below is taken after
      # the marks, so the recheck after the run sees those files as edited
      # too.
      #
      # The earlier results that are never handed on: a mutant that timed
      # out, or whose test run ended in an error. Stryker would keep such a
      # result after the test that reached it is gone, and a timeout also
      # depends on how long the whole test run takes to start, which any
      # added test changes (#855). They are taken out here, so Stryker tests
      # those mutants on every run (scripts/lib/checks/mutation-stale-results.mjs).
      #
      # The same step notes the test files of the restored results as they
      # were (a hash of each one's source), in a file beside them that is
      # never saved, for the recheck after the run (below). With nothing
      # restored, or on a forced run, Stryker reuses nothing, and the note
      # says so.
      #
      # Forced on the nightly run and on any run by hand (a manual run of
      # tool-mutation.yml or of PR Checks): both always retest everything.
      - name: Earlier timeouts and errors are tested again
        env:
          STRYKER_SCOPE: ${{ matrix.scope }}
          STRYKER_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
          STRYKER_FORCE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: node scripts/mutation-stale-results.mjs

      # Fails on a failed first test run and on a shard that finds nothing
      # to mutate. The score is judged in the floors job, over all shards.
      - name: Mutation testing of ${{ matrix.name }}
        env:
          STRYKER_SCOPE: ${{ matrix.scope }}
          STRYKER_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
          STRYKER_CONCURRENCY: '4'
          STRYKER_FORCE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
          NEWSLETTER_ID_BASE: HEAD^1
          PRIVACY_NOTICE_BASE: HEAD^1
          FLOORS_BASE: HEAD^1
        # `exec node`, not npx: when the run is cancelled the runner signals
        # this process, and Stryker itself must be the one to hear it, to
        # write what it has finished before it stops.
        run: exec node node_modules/@stryker-mutator/core/bin/stryker.js run stryker.config.mjs

      # The recheck of reused kills (#854,
      # scripts/lib/checks/mutation-recheck.mjs). Stryker hands a Killed
      # result on when a test that killed the mutant is unchanged. But a test
      # file added or edited in the same push may cover that mutant too and
      # run before the killer, and under the mutant it may crash as it loads
      # or be ended by the memory guard: a fresh run would say RuntimeError,
      # and one the guard ended counts as not caught. Which files cover a
      # mutant now is known only after Stryker's first test run, so the check
      # comes here: every Killed result that a new or edited test file covers
      # is taken out of the results, and the step below runs Stryker again
      # for those mutants.
      #
      # The rule for what is saved: no results are saved that still hold a
      # kill this step would take out. Once Stryker has written results, they
      # carry TODAY's test sources, so the next run would see no test as
      # edited and would never recheck such a kill. So this step runs
      # whatever happened before it (passed, failed, cancelled), before
      # anything is saved, and the two saving steps below wait for its
      # `checked` output: if it did not run, failed or was cut short, nothing
      # is saved. Where a run can stop, and what is then saved:
      #
      # - Before or during the step above that notes the test files: there
      #   is no note, this step fails, nothing is saved.
      # - During Stryker's first test run: Stryker has written nothing. The
      #   results on disk are the restored ones, with the OLD test sources;
      #   no test file differs from the note, nothing is taken out, and they
      #   are saved as they came. The next run compares them with its own
      #   tests again, so its recheck is not skipped.
      # - While Stryker tests mutants, or when it fails: it writes what it
      #   finished, reused kills included, with today's test sources. This
      #   step takes the kills to recheck out before the save; the next run
      #   finds no result for them and tests them in full.
      # - During this step: the results are replaced whole or not at all, and
      #   the output is set last. Without the output nothing is saved.
      # - During the second run's first test run: the results on disk are the
      #   ones this step left, with those kills already out.
      # - While the second run tests mutants, or when it fails: it writes
      #   what it finished: results it ran itself, and reused ones that no
      #   new or edited test file covers. The tests cannot change between
      #   the two runs (one checkout), so nothing in it needs a recheck.
      # - A runner that is shut down runs no further step: nothing is saved.
      #
      # On a forced run (nightly, by hand) and with nothing restored, every
      # result is fresh: nothing is taken out and there is no second run.
      - name: Kills a new or edited test covers are taken out, to be tested again
        id: recheck
        if: ${{ always() }}
        env:
          STRYKER_SCOPE: ${{ matrix.scope }}
          STRYKER_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: node scripts/mutation-recheck.mjs

      # The second run, only when the first passed and kills were taken out.
      # The same command and settings as the first. It reuses every result
      # left (their test sources are today's) and tests exactly the mutants
      # taken out, in full and in today's order. The shard's report is then
      # this run's; if it fails or is cancelled the shard fails, and the
      # first run's report is never kept in its place (the steps that keep
      # the report run only when every step before them passed).
      - name: Mutation testing of ${{ matrix.name }}, again for the kills taken out
        if: ${{ success() && steps.recheck.outputs.selected != '0' }}
        env:
          STRYKER_SCOPE: ${{ matrix.scope }}
          STRYKER_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
          STRYKER_CONCURRENCY: '4'
          STRYKER_FORCE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
          NEWSLETTER_ID_BASE: HEAD^1
          PRIVACY_NOTICE_BASE: HEAD^1
          FLOORS_BASE: HEAD^1
        run: exec node node_modules/@stryker-mutator/core/bin/stryker.js run stryker.config.mjs

      # What the shard finished is kept whether the run passed, failed or
      # was cancelled (by a newer push, or because another check failed), so
      # the next run does not start from nothing (#848 lost six runs that
      # way). Each entry is one mutant's finished result, so a part of a run
      # is as true as a whole one; the shard's own report and the floors are
      # untouched by it, and a shard that did not finish still fails the
      # gate. A file that does not parse is not saved, and nothing is saved
      # unless the recheck step above finished (its `checked` output), so no
      # kill it would take out is ever saved. (A runner that is shut down
      # runs no further step.)
      - name: Whether there are results to keep
        id: kept
        if: ${{ always() && steps.recheck.outputs.checked == 'true' }}
        env:
          FILE: reports/stryker-incremental/${{ matrix.name }}.json
          RESTORED: ${{ steps.earlier.outputs.cache-matched-key }}
        run: |
          echo "Earlier results restored from: ${RESTORED:-nothing}"
          if [ -s "$FILE" ] && [ -s "${FILE%.json}.deps.json" ] && node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!r.files || typeof r.files !== "object") process.exit(1); JSON.parse(require("fs").readFileSync(process.argv[2], "utf8")); console.log(`${Object.values(r.files).reduce((n, f) => n + f.mutants.length, 0)} mutant result(s) to keep`);' "$FILE" "${FILE%.json}.deps.json"; then
            echo "keep=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to keep."
          fi

      - name: Keep the results for the next run
        if: ${{ always() && steps.kept.outputs.keep == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/stryker-incremental/${{ matrix.name }}.json
            reports/stryker-incremental/${{ matrix.name }}.deps.json
          key: stryker-incremental-${{ matrix.name }}-${{ needs.mutation-plan.outputs.fingerprint }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The same results as an artifact, for the merge to main (its cache
      # cannot read this pull request's): mutation-seed copies them over.
      # Not named mutation-*, which the floors job collects as reports.
      - name: Keep the results for the merge
        if: ${{ always() && steps.kept.outputs.keep == 'true' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-incremental-${{ matrix.name }}
          path: |
            reports/stryker-incremental/${{ matrix.name }}.json
            reports/stryker-incremental/${{ matrix.name }}.deps.json
          retention-days: 7
          if-no-files-found: error

      # Incremental mode also writes earlier results for mutants outside this
      # shard; left in, a mutant that moved shards would be counted twice.
      - name: Keep only this shard's mutants
        env:
          STRYKER_SCOPE: ${{ matrix.scope }}
          STRYKER_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: node scripts/mutation-shard-report.mjs

      # Named mutation-<shard>, which the floors job collects by that prefix.
      # The other suites' artifacts start otherwise (tool-privacy-payloads-),
      # so none is read as a shard's report in a run that holds all three.
      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.name }}
          path: reports/mutation/${{ matrix.name }}.json
          retention-days: 14
          if-no-files-found: error

  # The gate: each scope's logic and its component(s), over all its shards,
  # each at or above its floor in stryker.floors.json. A floor only rises, to
  # 95 (#790).
  mutation-floors:
    needs: mutation-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: The shards' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: reports/mutation
          merge-multiple: true

      - name: Scores at or above their floors
        run: |
          failed=0
          for scope in $(node -p 'Object.keys(JSON.parse(require("fs").readFileSync("stryker.shards.json", "utf8"))).join(" ")'); do
            node scripts/mutation-floors.mjs "$scope" || failed=1
          done
          exit $failed

  # The mutation suite's result: it passes only when every job above passed.
  #
  # `always()` matters: a skipped job counts as a pass. Without a status
  # function GitHub skips this job when a job it needs has failed, and
  # `!cancelled()` skips it when the run is cancelled before it starts;
  # either way a gate that did not pass would read as a pass. With `always()`
  # it runs every time the mutation suite is asked for, and passes only when
  # every job above succeeded.
  mutation-gate:
    name: 'Free tools: mutation'
    needs: [mutation-plan, mutation-shard, mutation-floors, mutation-deps-trace]
    if: ${{ always() && inputs.suite == 'mutation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          PLAN: ${{ needs.mutation-plan.result }}
          RUN: ${{ needs.mutation-plan.outputs.run }}
          MUTATION: ${{ needs.mutation-shard.result }}
          FLOORS: ${{ needs.mutation-floors.result }}
          TRACE: ${{ needs.mutation-deps-trace.result }}
        run: |
          echo "plan: $PLAN (run: $RUN), mutation: $MUTATION, floors: $FLOORS, trace: $TRACE"
          # The trace runs only when asked for (skipped otherwise); when it ran, it must pass.
          if [ "$TRACE" != "skipped" ] && [ "$TRACE" != "success" ]; then
            echo "::error::The trace of what each test reaches did not pass. See the job above."
            exit 1
          fi
          # A pull request that changes no mutation input: the plan said so,
          # and nothing ran. Only that exact case passes without the shards.
          if [ "$PLAN" = "success" ] && [ "$RUN" = "false" ] && [ "$MUTATION" = "skipped" ] && [ "$FLOORS" = "skipped" ]; then
            echo "No mutation input changed: nothing to test."
            exit 0
          fi
          if [ "$PLAN" != "success" ] || [ "$MUTATION" != "success" ] || [ "$FLOORS" != "success" ]; then
            echo "::error::Free tools mutation testing did not pass (or did not run). See the jobs above."
            exit 1
          fi

  # A merge whose pull request's last run already tested this exact code
  # (mutation-plan's reuse step): each shard's results from that run go into
  # main's cache, so later pull requests start from them. Only parsed and
  # saved, never run. A shard whose results are not there (expired, or the
  # shard kept none) is not seeded, and the nightly run seeds it. The gate
  # does not wait for this job: it only fills a cache.
  mutation-seed:
    name: 'Mutation results from the pull request: ${{ matrix.name }}'
    needs: mutation-plan
    if: ${{ !cancelled() && needs.mutation-plan.outputs.seed != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    steps:
      # gh run download, not the download action: an artifact that expired or
      # went since the plan looked is then a shard not seeded, never a
      # failed job on main.
      - name: The pull request's results
        id: there
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ needs.mutation-plan.outputs.seed }}
          NAME: stryker-incremental-${{ matrix.name }}
        run: |
          if gh run download "$RUN" --name "$NAME" --dir reports/stryker-incremental; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not kept by run $RUN, or no longer there: not seeded."
          fi

      - name: They are results
        id: valid
        if: steps.there.outputs.found == 'true'
        env:
          FILE: reports/stryker-incremental/${{ matrix.name }}.json
        run: |
          if node -e 'const fs = require("fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!r || typeof r !== "object" || !r.files || typeof r.files !== "object") process.exit(1); const d = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); if (!d || typeof d !== "object" || !d.tests || typeof d.tests !== "object" || !d.sources || typeof d.sources !== "object") process.exit(1);' "$FILE" "${FILE%.json}.deps.json"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a results file with its dependency fingerprints: not seeded."
          fi

      - name: Into main's cache
        if: steps.valid.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/stryker-incremental/${{ matrix.name }}.json
            reports/stryker-incremental/${{ matrix.name }}.deps.json
          key: stryker-incremental-${{ matrix.name }}-${{ needs.mutation-plan.outputs.fingerprint }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The check of the shards' per-test-file fingerprints (#891): every test
  # file a mutation run starts, run with a trace of what it loads and reads
  # (scripts/check-mutation-deps.mjs). It fails when a test reaches a file
  # under src/ that its fingerprint leaves out: a change to that file would
  # not make Stryker test that test's mutants again. Nightly and by hand,
  # like the forced run beside it, which retests everything and so clears
  # any result such a gap left stale; a failure opens the nightly issue
  # (tool-mutation.yml). On a pull request only when it changes the analysis
  # or the trace (the plan says so), and then the gate waits for it. A trace
  # sees only what runs: the analysis itself must be conservative (council).
  mutation-deps-trace:
    name: 'Mutation: what each test reaches'
    needs: mutation-plan
    if: ${{ !cancelled() && inputs.suite == 'mutation' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.mutation-plan.outputs.trace == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base as well, for the tests that compare with it, as in the shards.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Each test's fingerprint holds what it reaches
        env:
          NEWSLETTER_ID_BASE: HEAD^1
          PRIVACY_NOTICE_BASE: HEAD^1
          FLOORS_BASE: HEAD^1
        run: node scripts/check-mutation-deps.mjs

  # ===========================================================================
  # Text size: the free tools at large text (#790, #791;
  # scripts/audit-text-size.mjs). Every tool in every language, on a bounded
  # range on pull requests (the narrowest phone, a phone, a tablet and a
  # laptop, at 100%, 200% and 400% text), and on the whole range of widths
  # and sizes, with and without the web fonts, every night and by hand.
  # ===========================================================================

  # A pull request that changes only files the build and the audit never read
  # (scripts/lib/checks/check-inputs.mjs: docs, agent files, other workflows,
  # the two root notes) skips the audit, and the summary job passes in that
  # one case. Nightly and manual runs always measure everything.
  text-size-plan:
    if: inputs.suite == 'text-size'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.inputs.outputs.run || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base as well (HEAD^1 of the merge commit), to list what the
          # pull request changes.
          fetch-depth: 2

      - name: Whether the pull request can change a measurement
        id: inputs
        if: github.event_name == 'pull_request'
        # Both ends of a move (--no-renames), NUL-separated (-z) so no name
        # is quoted or split. Anything but a clear "false" measures every tool.
        run: |
          run=true
          if git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"; then
            run=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { changedPaths, needsRun } from "./scripts/lib/checks/check-inputs.mjs";
              process.stdout.write(String(needsRun(changedPaths(readFileSync(process.argv[1], "utf8")), process.argv[2])));
            ' "$RUNNER_TEMP/changed" ".github/workflows/tool-text-size.yml") || run=true
          fi
          [ "$run" = "false" ] || run=true
          if [ "$run" = "false" ]; then echo "Only files the audit never reads changed: the tools are skipped."; else echo "Every tool is measured."; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  text-size-tool:
    name: 'Text size: ${{ matrix.tool }}'
    needs: text-size-plan
    if: ${{ !cancelled() && needs.text-size-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # On a pull request a failed tool cancels the others: the pull request
      # cannot merge either way. Nightly and by hand every tool reports.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      # Five tools at a time (owner, 2026-11-25). While it runs, mutation
      # waits for runners beyond the account's 20 (its cap, 18, is set for
      # after this suite and the other have finished).
      max-parallel: 5
      matrix:
        # The TOOLS of scripts/audit-text-size.mjs; scripts/repo-hygiene.test.mjs
        # fails when one is missing here.
        tool: [loan-comparison, multi-currency-net-worth, monte-carlo-simulator, invest-or-pay-off, inflation-calculator]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Ubuntu's runners stop unprivileged user namespaces, which Chrome's
      # sandbox needs. Allowing them keeps the sandbox on, rather than
      # starting Chrome without one.
      - name: Let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Serve the build
        run: |
          npx astro preview --port 4480 --host 127.0.0.1 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:4480/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/preview.log"; exit 1

      # Pull requests: the edges and the middle of the range, in every
      # language and state. CLAUDE.md, "Layout is checked at every size at once".
      - name: Text size, bounded range
        if: github.event_name == 'pull_request'
        run: node scripts/audit-text-size.mjs http://127.0.0.1:4480 --tool ${{ matrix.tool }} --width 320,375,768,1280 --size 100,200,400

      # Nightly and by hand: every width and size, then again in the
      # fallback fonts (what a reader sees while the fonts load).
      - name: Text size, whole range
        if: github.event_name != 'pull_request'
        run: node scripts/audit-text-size.mjs http://127.0.0.1:4480 --tool ${{ matrix.tool }}

      - name: Text size, whole range, fallback fonts
        if: github.event_name != 'pull_request'
        run: node scripts/audit-text-size.mjs http://127.0.0.1:4480 --tool ${{ matrix.tool }} --no-fonts

  # The text-size suite's result: it passes only when every job above passed.
  #
  # `always()` matters: a skipped job counts as a pass. Without a status
  # function GitHub skips this job when a job it needs has failed, and
  # `!cancelled()` skips it when the run is cancelled before it starts;
  # either way a gate that did not pass would read as a pass. With `always()`
  # it runs every time the text-size suite is asked for, and passes only
  # when every job above succeeded.
  text-size-gate:
    name: 'Free tools: text size'
    needs: [text-size-plan, text-size-tool]
    if: ${{ always() && inputs.suite == 'text-size' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          PLAN: ${{ needs.text-size-plan.result }}
          RUN: ${{ needs.text-size-plan.outputs.run }}
          TEXT_SIZE: ${{ needs.text-size-tool.result }}
        run: |
          echo "plan: $PLAN (run: $RUN), text-size: $TEXT_SIZE"
          # A pull request that changes nothing the audit reads: the plan said
          # so, and nothing ran. Only that exact case passes without the audit.
          if [ "$PLAN" = "success" ] && [ "$RUN" = "false" ] && [ "$TEXT_SIZE" = "skipped" ]; then
            echo "Nothing the audit reads changed: nothing to measure."
            exit 0
          fi
          if [ "$PLAN" != "success" ] || [ "$TEXT_SIZE" != "success" ]; then
            echo "::error::The free tools text-size audit did not pass (or did not run). See the jobs above."
            exit 1
          fi
