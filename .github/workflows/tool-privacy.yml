name: Tool privacy check

# The browser check of CLAUDE.md, "Free tools keep inputs out of URLs", rule 6:
# nothing a reader types into a free tool may reach PostHog. It uses every
# free tool in a real browser, in every language, on a phone-sized and a
# laptop-sized window, with cookie consent declined and accepted, and reads
# every request the page tries to send to PostHog (scripts/verify-tool-privacy.mjs).
#
# Runs on a pull request that touches a tool, the analytics, the header's
# language switch, the consent code or the check itself; every night, since a
# PostHog SDK update can change what is sent with no change here; and by hand.
#
# Nothing reaches PostHog. The build carries a dummy key that PostHog rejects
# (PUBLIC_ANALYTICS_TEST=1), the script answers PostHog's settings request
# itself, aborts every other request to PostHog, and starts Chrome unable to
# resolve the ingestion host. Only the SDK's static scripts are downloaded.
#
# The run needs a window: PostHog does not send $pageleave from a headless
# browser, so Chrome runs under xvfb.

# The job is a REQUIRED status check on `main` (Settings -> Branches), so a
# pull request with auto-merge on waits for it. That is why the path filter
# lives in the "Privacy check: changed files" job below rather than under
# `on.pull_request.paths`: a workflow that a path filter stops from starting
# never reports, and GitHub then waits for its required check forever. A job
# skipped by `if:` reports "skipped", which satisfies a required check.
# Renaming the "No typed value reaches analytics" job means changing the
# required check in the same breath.
on:
  pull_request:
    branches: [main]
  schedule:
    # 03:41 UTC every day, away from the deploy and newsletter crons.
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Install scripts: every `npm ci` here fails if a dependency has an install
# script that the project's package.json `allowScripts` does not cover (for
# example a puppeteer bump whose pinned approval has not been updated). Only
# CI is strict: in .npmrc it would stop Dependabot from opening those PRs at
# all. See README "Install scripts".
env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'

jobs:
  # Which files the pull request touches. The check runs only when one of them
  # matches a pattern here; the nightly and manual runs always run it. Patterns
  # are bash globs, where `*` also matches `/`.
  changes:
    name: 'Privacy check: changed files'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The PR's merge commit and its first parent, the base it merges
          # into, so `HEAD^1 HEAD` is exactly what the PR changes.
          fetch-depth: 2

      - name: Match changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          patterns=(
            'src/components/*'
            'src/layouts/*'
            'src/pages/free/*'
            'src/pages/\[locale\]/free/*'
            'src/utils/*'
            'src/i18n/config.ts'
            'scripts/verify-tool-privacy.mjs'
            'scripts/lib/tool-privacy-checks.mjs'
            '.github/workflows/tool-privacy.yml'
            'package.json'
            'package-lock.json'
          )
          run=false
          while IFS= read -r file; do
            for pattern in "${patterns[@]}"; do
              # Unquoted on purpose: the pattern is a glob.
              if [[ "$file" == $pattern ]]; then
                echo "matched: $file ($pattern)"
                run=true
                break 2
              fi
            done
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # One job per tool, side by side: the same hundred runs as one long job
  # (every tool, language, window size and consent state), in about a third
  # of the time. Each job is whole in itself: its own test build, the planted
  # leak for its tool, then that tool's twenty runs, both window sizes among
  # them, so the script's rule that a tool shows both a rage click and a dead
  # click across its runs still applies. The list is every tool under
  # src/pages/free; a unit test (scripts/lib/tool-privacy-checks.test.mjs)
  # fails when a tool is missing here.
  verify-tool:
    name: 'Privacy check: ${{ matrix.tool }}'
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A leak in one tool does not stop the others from reporting.
      fail-fast: false
      matrix:
        tool:
          - loan-comparison
          - multi-currency-net-worth
          - monte-carlo-simulator
          - inflation-calculator
          - invest-or-pay-off
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # A test build: analytics run on localhost with a key PostHog rejects.
      # No real key is ever given to this workflow.
      - name: Build (test build)
        run: npm run build
        env:
          PUBLIC_ANALYTICS_TEST: '1'

      # The check checking itself: with a typed amount planted in an event,
      # every run must fail. A check that cannot fail proves nothing.
      - name: The check catches a planted leak
        run: xvfb-run -a node scripts/verify-tool-privacy.mjs --plant-leak --tool ${{ matrix.tool }} --locale en --viewport laptop --jobs 2 --dump tool-privacy-payloads

      - name: Every language, window size and consent state
        run: xvfb-run -a node scripts/verify-tool-privacy.mjs --tool ${{ matrix.tool }} --jobs 3 --dump tool-privacy-payloads

      # The decoded payloads of a failed run, to see what was sent. They hold
      # only the test's own made-up values.
      - name: Keep the payloads of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tool-privacy-payloads-${{ matrix.tool }}
          path: tool-privacy-payloads
          retention-days: 7
          if-no-files-found: ignore

  # The required check. It passes only when every tool's job passed.
  #
  # `!cancelled()` matters: without a status function GitHub skips this job
  # when a job it needs has failed, and a skipped job satisfies a required
  # check, so a leak would read as a pass. It is skipped only when the
  # changed-files job succeeded and said there is nothing to check. (A run
  # that a newer push cancelled reports cancelled, which satisfies nothing.)
  verify:
    name: No typed value reaches analytics
    needs: [changes, verify-tool]
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.run != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every tool's check passed
        env:
          CHANGES: ${{ needs.changes.result }}
          TOOLS: ${{ needs.verify-tool.result }}
        run: |
          echo "changed files: $CHANGES, tools: $TOOLS"
          if [ "$CHANGES" != "success" ] || [ "$TOOLS" != "success" ]; then
            echo "::error::A tool's privacy check did not pass (or did not run). See the 'Privacy check: <tool>' jobs."
            exit 1
          fi
