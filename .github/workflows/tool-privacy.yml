name: Tool privacy check

# The browser check of CLAUDE.md, "Free tools keep inputs out of URLs", rule 6:
# nothing a reader types into a free tool may reach PostHog. Its jobs are in
# tool-suite.yml (the privacy suite), with what they check and how nothing
# reaches PostHog.
#
# This workflow runs the suite every night and by hand, on every tool,
# language, window size and consent state. Pull requests do not start it:
# PR Checks (pr-checks.yml) runs the same suite on every pull request, after
# the build, beside mutation and text size, and holds the required check "No
# typed value reaches analytics".
on:
  schedule:
    # 03:41 UTC every day, away from the deploy and newsletter crons. GitHub
    # starts it hours later (see deploy.yml).
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group, so a manual run never cancels the nightly one.
concurrency:
  group: tool-privacy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Its jobs show as "Tool privacy check / <job>". Every tool reports, even
  # after one fails (the suite is fail-fast on pull requests only).
  privacy:
    name: Tool privacy check
    # The suite's mutation jobs read, on a merge, the pull request's runs and
    # artifacts (tool-suite.yml, mutation-plan and mutation-seed); a called
    # workflow can ask for no more than its caller grants.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/tool-suite.yml
    with:
      suite: privacy

  # Nobody watches the nightly run, so one that failed or timed out opens an
  # issue, or adds to the one already open. The issue links the run and says
  # nothing of what was found: a weakness does not go in the public tracker
  # (CLAUDE.md, "Private stays private"). It is here, not in tool-suite.yml,
  # so the suite never holds a token that can write: only this job, on a
  # nightly run, can.
  alert:
    needs: [privacy]
    if: github.event_name == 'schedule' && (failure() || (!cancelled() && contains(needs.*.result, 'cancelled')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write   # open or comment on the privacy-check-alert issue
    steps:
      - name: Open or update the privacy-check-alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh is told which repository.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          TITLE="Nightly tool check did not pass ($(date -u +%Y-%m-%d))"
          BODY="$RUNNER_TEMP/privacy-check-alert.md"
          {
            echo "The nightly check of the free tools did not finish green. The cause can be the test, the runner, a dependency or the site: this issue does not say which."
            echo
            echo "- Workflow run: $RUN_URL (attempt $ATTEMPT)"
            echo
            echo "Open the run to see which job failed. Do not copy what it found into this issue. Close the issue once a nightly run has passed. While it is open, further failures are added here as comments."
          } > "$BODY"

          # De-dupe: one open alert at a time.
          EXISTING=$(gh issue list --state open --label privacy-check-alert --limit 1 --json number --jq '.[0].number // empty' || echo "")
          if [ -n "${EXISTING:-}" ]; then
            echo "Appending to existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file "$BODY"
          else
            echo "Opening new issue"
            gh issue create --title "$TITLE" --label privacy-check-alert --body-file "$BODY" || {
              # If the label doesn't exist yet, create it and retry once.
              gh label create privacy-check-alert --color D93F0B --description "The nightly tool check did not pass" || true
              gh issue create --title "$TITLE" --label privacy-check-alert --body-file "$BODY"
            }
          fi
