name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Pushes that only update the newsletter marker file shouldn't trigger
    # a rebuild/redeploy: prevents a self-triggering loop after the
    # newsletter workflow commits .last-sent-guid.txt back to main.
    paths-ignore:
      - '.last-sent-guid.txt'
  schedule:
    # Daily rebuild to publish date-gated posts. Since 27 Aug 2026 GitHub
    # starts this repository's scheduled workflows 4.5 to 10 hours after
    # their cron time (this one at 10:55 to 12:38 UTC in Nov 2026), and the
    # twelve slots below come out as one run a day, because they all fall due
    # inside that delay. The lag is GitHub's: no cron expression here changes
    # it, and it is not stable enough to plan around (#329). That is after the
    # 06:45 UTC reel, so scripts/deploy-trigger.gs dispatches this workflow at
    # about 05:30 UTC. The dispatch is the only on-time path; this schedule
    # is its backstop.
    # The newsletter workflow is triggered downstream of this (via the
    # trigger-newsletter job below), so scheduled deploys also end up
    # firing a newsletter pass, which, if nothing is pending, is a no-op
    # plus a bounce scan.
    - cron: '3,18,33,48 4,5,6 * * *'
  workflow_dispatch:

# No job gets anything by default; each asks for what it needs. The build job
# runs third-party code (npm ci, the build), so it can only read the code.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

# Install scripts: every `npm ci` here fails if a dependency has an install
# script that the project's package.json `allowScripts` does not cover (for
# example a puppeteer bump whose pinned approval has not been updated). Only
# CI is strict: in .npmrc it would stop Dependabot from opening those PRs at
# all. See README "Install scripts".
env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    # A build takes about two and a half minutes. Without a limit a hung
    # Chrome (the figure renders) would hold the `pages` group, which never
    # cancels, for GitHub's six hours and block every later deploy (#328).
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the privacy notice can derive its "Last updated"
          # from `git log -1 --format=%aI -- src/components/pages/PrivacyPage.astro
          # src/utils/privacyChangelogEntries.ts` at build time (see the gitLastCommitDate
          # helper in the page). With the default fetch-depth: 1, that query returns
          # empty when the most recent commit didn't happen to touch them, which would
          # silently fall back to the changelog entry's date and defeat the
          # whole point of the automation.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_NEWSLETTER_ENDPOINT: ${{ secrets.PUBLIC_NEWSLETTER_ENDPOINT }}
          PUBLIC_WAITLIST_ENDPOINT: ${{ secrets.PUBLIC_WAITLIST_ENDPOINT }}
          # Not PUBLIC_: read at build to show the waitlist's rounded size, never sent to a browser.
          WAITLIST_COUNT_TOKEN: ${{ secrets.WAITLIST_COUNT_TOKEN }}
          NEWSLETTER_COUNT_TOKEN: ${{ secrets.NEWSLETTER_COUNT_TOKEN }}
          # A test build runs analytics with a dummy key (Analytics.astro).
          PUBLIC_ANALYTICS_TEST: ''

      - name: Refuse a test analytics build
        run: |
          if grep -rq "phc_local_test_build_not_a_real_key" dist; then
            echo "::error::dist was built with PUBLIC_ANALYTICS_TEST=1, which carries a dummy PostHog key."
            exit 1
          fi

      - name: Compute IndexNow URL hash manifest
        # SHA-256 the rendered HTML for every URL in dist/sitemap-index.xml
        # and write the per-URL manifest to .indexnow/current.json. The
        # post-deploy `indexnow-ping` job downloads this artifact, diffs
        # it against the previous run's manifest (restored from cache),
        # and submits only URLs whose hash changed. See scripts/indexnow.mjs.
        # The manifest lives OUTSIDE dist/ on purpose so it doesn't end up
        # in the GitHub Pages artifact and get served at /.indexnow/.
        run: |
          mkdir -p .indexnow
          node scripts/indexnow.mjs hash dist > .indexnow/current.json
          echo "Wrote $(wc -l < .indexnow/current.json) lines, $(wc -c < .indexnow/current.json) bytes"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # The action leaves out files and folders whose name starts with a
          # dot unless told otherwise, and /.well-known/security.txt is one.
          # Nothing else in dist/ starts with a dot.
          include-hidden-files: true

      - name: Upload IndexNow manifest as artifact
        # Separate from the Pages artifact: the manifest is internal
        # build metadata, not site content. Short retention because the
        # only consumer (`indexnow-ping`) runs in the same workflow run.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexnow-hashes
          path: .indexnow/current.json
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Usually under half a minute; the action itself gives up after ten.
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Notify IndexNow-participating search engines (Bing, DuckDuckGo,
  # Yandex, Seznam, Naver, Yep) that our content has changed. Google does
  # NOT participate in IndexNow; its index is updated on its own crawl
  # schedule via the sitemap and Search Console.
  #
  # Diff-based submission. Each run uploads a SHA-256-per-URL manifest
  # as the `indexnow-hashes` artifact (computed in the build job). This
  # job restores the previous run's manifest from cache, runs
  # scripts/indexnow.mjs `submit`, which diffs the two and POSTs only
  # URLs whose hash is new or has changed.
  #
  # Because the diff is what drives submission, the schedule trigger is
  # SAFE to include here: a no-op rebuild produces an empty diff and
  # silently skips the API call. We removed the previous `event_name !=
  # 'schedule'` guard so date-gated posts crossing their pubDate during
  # the daily rebuild are also pinged immediately.
  #
  # The key file is committed at public/<key>.txt and ships as part of
  # the static site, which is what IndexNow validates before accepting a
  # submission. The key is *not* secret: by design, it has to be
  # publicly readable at <host>/<key>.txt to function. We hardcode it
  # here rather than pull from a secret so the source of truth lives
  # next to the file it must match.
  #
  # `continue-on-error: true` keeps a rejected or rate-limited IndexNow
  # ping from turning the deploy red. The deploy itself has already
  # succeeded by the time this job runs; failing the workflow because a
  # third-party search engine API was flaky would be misleading.
  indexnow-ping:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    # About a minute, most of it the wait below.
    timeout-minutes: 10
    permissions:
      contents: read
    continue-on-error: true
    env:
      # The key MUST match public/<key>.txt. Rotating it requires
      # renaming the file in public/ and updating this single constant
      # in lockstep: keep them as close to literally adjacent as the
      # tooling allows.
      INDEXNOW_KEY: f5c9f51a26d65196884f3dc7a7687284
    steps:
      - name: Checkout (for scripts/indexnow.mjs)
        # Shallow checkout: we only need the script file to run.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Wait for GitHub Pages propagation
        # IndexNow validates keyLocation is reachable AND contains the
        # expected key BEFORE accepting a submission. 45s mirrors the
        # propagation budget the trigger-newsletter job already uses
        # successfully, so it's a known-good number for this CDN.
        run: sleep 45

      - name: Verify IndexNow key file is reachable
        # Cheap pre-flight: surfaces "wrong key file content" or "404
        # because the new public/<key>.txt didn't deploy" as a workflow
        # warning instead of a silent IndexNow rejection later.
        # `exit 0` keeps the workflow green; the warning is enough.
        #
        # The step says how it went in `ok`. The submission and the new
        # baseline below both wait for `ok=true`: the warning used to say
        # "Skipping submission" while the list was posted anyway, rejected,
        # and then saved as the baseline, so those URLs were never sent
        # again (#447). Now a skipped run keeps the old baseline and the
        # next deploy submits them.
        id: keycheck
        run: |
          set -euo pipefail
          got=$(curl -fsS "https://nidhi.today/${INDEXNOW_KEY}.txt" | tr -d '[:space:]' || echo "")
          if [ "$got" != "$INDEXNOW_KEY" ]; then
            echo "::warning::Key file at https://nidhi.today/${INDEXNOW_KEY}.txt returned '$got' (length ${#got}); expected '${INDEXNOW_KEY}'. Skipping submission; the next deploy submits these URLs."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "Key file OK."

      - name: Download current run's URL hash manifest
        # Produced by the build job above; lands at .indexnow/current.json.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow-hashes
          path: .indexnow/

      - name: Restore previous run's URL hash manifest from cache
        # On first run nothing is restored and indexnow.mjs treats the
        # missing previous manifest as empty (so every URL counts as
        # new). The unique key per run guarantees a fresh save below;
        # the prefix-only restore-keys grabs the most recent prior
        # manifest regardless of which run created it.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow/manifest.json
          key: indexnow-hashes-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-hashes-

      - name: Submit changed URLs to IndexNow
        # `submit` reads the previous manifest if it exists (cache hit)
        # or treats it as empty (cache miss / first run), diffs against
        # the current run's manifest, and POSTs only the changed list.
        # If the diff is empty it logs and exits without making the
        # network call. Documented exit semantics in scripts/indexnow.mjs.
        if: steps.keycheck.outputs.ok == 'true'
        run: |
          node scripts/indexnow.mjs submit \
            .indexnow/manifest.json \
            .indexnow/current.json \
            "${INDEXNOW_KEY}"

      - name: Stage current manifest as next run's "previous"
        # Run this step even if submit hit a non-2xx, so the next run's
        # diff stays accurate. If we only saved on success, a flaky
        # IndexNow API would cause us to re-submit the same URLs on every
        # run until it succeeded, which is exactly the spam pattern the
        # protocol asks submitters to avoid. The one case it does not run
        # is a submission that was never attempted (the key check above):
        # then the previous manifest stays the baseline.
        if: always() && steps.keycheck.outputs.ok == 'true'
        run: cp .indexnow/current.json .indexnow/manifest.json

      - name: Save manifest as cache for next run
        # Nothing new to save when the submission was skipped: the next run
        # restores the newest manifest there is, which is the old baseline.
        if: always() && steps.keycheck.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow/manifest.json
          key: indexnow-hashes-${{ github.run_id }}-${{ github.run_attempt }}

  # Hand off to the newsletter workflow (see .github/workflows/newsletter.yml)
  # AFTER a propagation delay: GitHub Pages reports deploy success when the
  # deployment API call succeeds, but the CDN can take up to ~60s to make
  # the new /rss.xml globally visible. Newsletter's live-fetch mode reads
  # /rss.xml to discover unsent posts, so firing it too early would see
  # yesterday's feed and silently send nothing.
  #
  # This job is intentionally a separate job (not a step) so:
  #  - the `deploy` job completes and shows green immediately, giving a
  #    clean "site is live" signal in the Actions UI;
  #  - the newsletter workflow shows up as its own run in the Actions tab,
  #    making its success/failure independently auditable;
  #  - a slow or broken newsletter send never delays or blocks the deploy.
  #
  # The trigger is via `gh workflow run`, which fires a workflow_dispatch
  # event: the same trigger the Actions UI's "Run workflow" button uses,
  # so manual and automatic invocations share one code path in
  # newsletter.yml.
  trigger-newsletter:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    # About a minute: the wait below, then one dispatch.
    timeout-minutes: 10
    permissions:
      actions: write   # to start newsletter.yml with workflow_dispatch
    steps:
      - name: Wait for GitHub Pages propagation
        # 45s is comfortably above the typical 10-30s GitHub Pages takes to
        # make a fresh deploy globally visible, but below the 5-minute
        # Apps Script budget the newsletter send itself will consume.
        # Tune via PAGES_PROPAGATION_SECONDS if you ever see the newsletter
        # fetch stale RSS (symptom: a push that added a new post doesn't
        # result in any newsletter email on the next run).
        run: |
          DELAY="${PAGES_PROPAGATION_SECONDS:-45}"
          echo "Sleeping ${DELAY}s to let the CDN propagate the new deploy…"
          sleep "$DELAY"
        env:
          PAGES_PROPAGATION_SECONDS: ${{ vars.PAGES_PROPAGATION_SECONDS }}

      - name: Trigger newsletter workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --ref is the branch to run against (newsletter.yml must exist on
        # that ref). We always run the version of newsletter.yml that's on
        # main, regardless of which commit triggered this deploy: the two
        # workflows are independently versioned by design, and we avoid
        # dispatching an old newsletter.yml by accident.
        run: |
          echo "Dispatching newsletter workflow on main…"
          gh workflow run newsletter.yml \
            --repo "${{ github.repository }}" \
            --ref main

  # Says so when a deploy fails. Until this job existed a failed deploy showed
  # only in the Actions tab and in GitHub's own email, while scheduled lessons
  # and the same morning's reel links wait on the daily deploy (#328). It
  # mirrors the newsletter workflow's alert: an issue, labelled so it can be
  # found, that a person closes once the site is deploying again.
  #
  # Runs when the build, the deploy or the newsletter hand-off failed or
  # timed out; not when a run was cancelled. The IndexNow job is left out: it
  # is allowed to fail (see its comment) and never turns the run red.
  #
  # One open issue at a time: while a `deploy-alert` issue is open, each
  # further failure adds a comment to it instead of opening another.
  alert:
    needs: [build, deploy, trigger-newsletter]
    # failure() covers a job that failed. A job stopped by its time limit can
    # be reported as cancelled instead, so that is covered too; a run a
    # person cancelled (cancelled() is true) stays quiet.
    if: failure() || (!cancelled() && contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write   # open or comment on the deploy-alert issue
    steps:
      - name: Open or update the deploy-alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh is told which repository.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          HANDOFF: ${{ needs.trigger-newsletter.result }}
        run: |
          set -euo pipefail
          TITLE="Deploy failed ($(date -u +%Y-%m-%d))"
          BODY="$RUNNER_TEMP/deploy-alert.md"
          {
            echo "A deploy of the site did not finish. The site keeps serving the last deploy that succeeded."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Started by | \`$EVENT\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Build | \`$BUILD\` |"
            echo "| Deploy | \`$DEPLOY\` |"
            echo "| Newsletter hand-off | \`$HANDOFF\` |"
            echo
            echo "- Workflow run: $RUN_URL (attempt $ATTEMPT)"
            echo
            echo "**What to check first**"
            echo "1. Open the run and read the first failed job's log."
            echo "2. A deploy job that stopped at \"Timeout reached\" or \"updating_pages\" is usually GitHub Pages being slow: re-run the failed jobs."
            echo "3. A failed build is a real error in the site or its content (a lesson dated today is built for the first time today): fix it on main, and the push deploys."
            echo "4. If only the newsletter hand-off failed, the site is live: start \"Newsletter pipeline\" by hand from the Actions tab."
            echo
            echo "Close this issue once a deploy has succeeded. While it is open, further failures are added here as comments."
          } > "$BODY"

          # De-dupe: one open alert at a time.
          EXISTING=$(gh issue list --state open --label deploy-alert --limit 1 --json number --jq '.[0].number // empty' || echo "")
          if [ -n "${EXISTING:-}" ]; then
            echo "Appending to existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file "$BODY"
          else
            echo "Opening new issue"
            gh issue create --title "$TITLE" --label deploy-alert --body-file "$BODY" || {
              # If the label doesn't exist yet, create it and retry once.
              gh label create deploy-alert --color D93F0B --description "A deploy of the site failed" || true
              gh issue create --title "$TITLE" --label deploy-alert --body-file "$BODY"
            }
          fi
