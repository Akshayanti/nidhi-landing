name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Pushes that only update the newsletter marker file shouldn't trigger
    # a rebuild/redeploy — prevents a self-triggering loop after the
    # newsletter workflow commits .last-sent-guid.txt back to main.
    paths-ignore:
      - '.last-sent-guid.txt'
  schedule:
    # Daily rebuild at 06:03 UTC (08:03 CEST) to publish date-gated posts.
    # The newsletter workflow is triggered downstream of this (via the
    # trigger-newsletter job below), so scheduled deploys also end up
    # firing a newsletter pass — which, if nothing is pending, is a no-op
    # plus a bounce scan.
    - cron: '3,18,33,48 4,5,6 * * *'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  actions: write   # required so trigger-newsletter can workflow_dispatch newsletter.yml

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so src/pages/privacy.astro can derive its "Last updated"
          # from `git log -1 --format=%aI -- src/pages/privacy.astro` at build
          # time (see the gitLastCommitDate helper in that file). With the
          # default fetch-depth: 1, that query returns empty when the most
          # recent commit didn't happen to touch privacy.astro, which would
          # silently fall back to the changelog entry's date and defeat the
          # whole point of the automation.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Privacy-notice changelog guard
        # Nudges (doesn't fail) when src/pages/privacy.astro was edited in
        # the latest commit but the `changelog` array at the top of the file
        # wasn't also touched. The top-of-page "Last updated" bumps itself
        # from git regardless; this guard is about the human-readable
        # changelog staying in sync with real edits.
        run: |
          FILE=src/pages/privacy.astro
          # Did the latest commit touch the file at all?
          if ! git diff --quiet HEAD~1 HEAD -- "$FILE" 2>/dev/null; then
            # Did that same commit also modify the `changelog` array?
            # We look for added lines that contain ChangelogEntry-ish keys.
            ADDED=$(git diff HEAD~1 HEAD -- "$FILE" | grep -E '^\+[[:space:]]*(date|iso|material|summary):' || true)
            if [ -z "$ADDED" ]; then
              echo "::warning file=$FILE::privacy.astro was modified but no new changelog entry was added. If the change is material (new processor, data category, retention), please add an entry to the \`changelog\` array."
            else
              echo "privacy.astro changed and changelog entry was updated — ok."
            fi
          fi

      - name: Build
        run: npm run build
        env:
          COUNTERAPI_TOKEN: ${{ secrets.COUNTERAPI_TOKEN }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_NEWSLETTER_ENDPOINT: ${{ secrets.PUBLIC_NEWSLETTER_ENDPOINT }}
          PUBLIC_WAITLIST_ENDPOINT: ${{ secrets.PUBLIC_WAITLIST_ENDPOINT }}

      - name: Compute IndexNow URL hash manifest
        # SHA-256 the rendered HTML for every URL in dist/sitemap-index.xml
        # and write the per-URL manifest to .indexnow/current.json. The
        # post-deploy `indexnow-ping` job downloads this artifact, diffs
        # it against the previous run's manifest (restored from cache),
        # and submits only URLs whose hash changed. See scripts/indexnow.mjs.
        # The manifest lives OUTSIDE dist/ on purpose so it doesn't end up
        # in the GitHub Pages artifact and get served at /.indexnow/.
        run: |
          mkdir -p .indexnow
          node scripts/indexnow.mjs hash dist > .indexnow/current.json
          echo "Wrote $(wc -l < .indexnow/current.json) lines, $(wc -c < .indexnow/current.json) bytes"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload IndexNow manifest as artifact
        # Separate from the Pages artifact: the manifest is internal
        # build metadata, not site content. Short retention because the
        # only consumer (`indexnow-ping`) runs in the same workflow run.
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-hashes
          path: .indexnow/current.json
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Notify IndexNow-participating search engines (Bing, DuckDuckGo,
  # Yandex, Seznam, Naver, Yep) that our content has changed. Google does
  # NOT participate in IndexNow; its index is updated on its own crawl
  # schedule via the sitemap and Search Console.
  #
  # Diff-based submission. Each run uploads a SHA-256-per-URL manifest
  # as the `indexnow-hashes` artifact (computed in the build job). This
  # job restores the previous run's manifest from cache, runs
  # scripts/indexnow.mjs `submit`, which diffs the two and POSTs only
  # URLs whose hash is new or has changed.
  #
  # Because the diff is what drives submission, the schedule trigger is
  # SAFE to include here: a no-op rebuild produces an empty diff and
  # silently skips the API call. We removed the previous `event_name !=
  # 'schedule'` guard so date-gated posts crossing their pubDate during
  # the daily rebuild are also pinged immediately.
  #
  # The key file is committed at public/<key>.txt and ships as part of
  # the static site, which is what IndexNow validates before accepting a
  # submission. The key is *not* secret: by design, it has to be
  # publicly readable at <host>/<key>.txt to function. We hardcode it
  # here rather than pull from a secret so the source of truth lives
  # next to the file it must match.
  #
  # `continue-on-error: true` keeps a rejected or rate-limited IndexNow
  # ping from turning the deploy red. The deploy itself has already
  # succeeded by the time this job runs; failing the workflow because a
  # third-party search engine API was flaky would be misleading.
  indexnow-ping:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # The key MUST match public/<key>.txt. Rotating it requires
      # renaming the file in public/ and updating this single constant
      # in lockstep — keep them as close to literally adjacent as the
      # tooling allows.
      INDEXNOW_KEY: f5c9f51a26d65196884f3dc7a7687284
    steps:
      - name: Checkout (for scripts/indexnow.mjs)
        # Shallow checkout: we only need the script file to run.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for GitHub Pages propagation
        # IndexNow validates keyLocation is reachable AND contains the
        # expected key BEFORE accepting a submission. 45s mirrors the
        # propagation budget the trigger-newsletter job already uses
        # successfully, so it's a known-good number for this CDN.
        run: sleep 45

      - name: Verify IndexNow key file is reachable
        # Cheap pre-flight: surfaces "wrong key file content" or "404
        # because the new public/<key>.txt didn't deploy" as a workflow
        # warning instead of a silent IndexNow rejection later.
        # `exit 0` keeps the workflow green; the warning is enough.
        run: |
          set -euo pipefail
          got=$(curl -fsS "https://nidhi.today/${INDEXNOW_KEY}.txt" | tr -d '[:space:]' || echo "")
          if [ "$got" != "$INDEXNOW_KEY" ]; then
            echo "::warning::Key file at https://nidhi.today/${INDEXNOW_KEY}.txt returned '$got' (length ${#got}); expected '${INDEXNOW_KEY}'. Skipping submission."
            exit 0
          fi
          echo "Key file OK."

      - name: Download current run's URL hash manifest
        # Produced by the build job above; lands at .indexnow/current.json.
        uses: actions/download-artifact@v4
        with:
          name: indexnow-hashes
          path: .indexnow/

      - name: Restore previous run's URL hash manifest from cache
        # On first run nothing is restored and indexnow.mjs treats the
        # missing previous manifest as empty (so every URL counts as
        # new). The unique key per run guarantees a fresh save below;
        # the prefix-only restore-keys grabs the most recent prior
        # manifest regardless of which run created it.
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/manifest.json
          key: indexnow-hashes-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-hashes-

      - name: Submit changed URLs to IndexNow
        # `submit` reads the previous manifest if it exists (cache hit)
        # or treats it as empty (cache miss / first run), diffs against
        # the current run's manifest, and POSTs only the changed list.
        # If the diff is empty it logs and exits without making the
        # network call. Documented exit semantics in scripts/indexnow.mjs.
        run: |
          node scripts/indexnow.mjs submit \
            .indexnow/manifest.json \
            .indexnow/current.json \
            "${INDEXNOW_KEY}"

      - name: Stage current manifest as next run's "previous"
        # Always run this step (even if submit hit a non-2xx) so the
        # next run's diff stays accurate. If we only saved on success, a
        # flaky IndexNow API would cause us to re-submit the same URLs
        # on every run until it succeeded, which is exactly the spam
        # pattern the protocol asks submitters to avoid.
        if: always()
        run: cp .indexnow/current.json .indexnow/manifest.json

      - name: Save manifest as cache for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .indexnow/manifest.json
          key: indexnow-hashes-${{ github.run_id }}-${{ github.run_attempt }}

  # Hand off to the newsletter workflow (see .github/workflows/newsletter.yml)
  # AFTER a propagation delay — GitHub Pages reports deploy success when the
  # deployment API call succeeds, but the CDN can take up to ~60s to make
  # the new /rss.xml globally visible. Newsletter's live-fetch mode reads
  # /rss.xml to discover unsent posts, so firing it too early would see
  # yesterday's feed and silently send nothing.
  #
  # This job is intentionally a separate job (not a step) so:
  #  - the `deploy` job completes and shows green immediately, giving a
  #    clean "site is live" signal in the Actions UI;
  #  - the newsletter workflow shows up as its own run in the Actions tab,
  #    making its success/failure independently auditable;
  #  - a slow or broken newsletter send never delays or blocks the deploy.
  #
  # The trigger is via `gh workflow run`, which fires a workflow_dispatch
  # event — the same trigger the Actions UI's "Run workflow" button uses,
  # so manual and automatic invocations share one code path in
  # newsletter.yml.
  trigger-newsletter:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages propagation
        # 45s is comfortably above the typical 10-30s GitHub Pages takes to
        # make a fresh deploy globally visible, but below the 5-minute
        # Apps Script budget the newsletter send itself will consume.
        # Tune via PAGES_PROPAGATION_SECONDS if you ever see the newsletter
        # fetch stale RSS (symptom: a push that added a new post doesn't
        # result in any newsletter email on the next run).
        run: |
          DELAY="${PAGES_PROPAGATION_SECONDS:-45}"
          echo "Sleeping ${DELAY}s to let the CDN propagate the new deploy…"
          sleep "$DELAY"
        env:
          PAGES_PROPAGATION_SECONDS: ${{ vars.PAGES_PROPAGATION_SECONDS }}

      - name: Trigger newsletter workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --ref is the branch to run against (newsletter.yml must exist on
        # that ref). We always run the version of newsletter.yml that's on
        # main, regardless of which commit triggered this deploy — the two
        # workflows are independently versioned by design, and we avoid
        # dispatching an old newsletter.yml by accident.
        run: |
          echo "Dispatching newsletter workflow on main…"
          gh workflow run newsletter.yml \
            --repo "${{ github.repository }}" \
            --ref main
