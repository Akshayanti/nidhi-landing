name: Free tools mutation

# Mutation testing of the free tools (#790, #846), on every pull request,
# every night and by hand. StrykerJS (stryker.config.mjs) mutates every
# tool's logic and component, and the code they share; each scope's logic and
# component are held on their own (never pooled) to their floors in
# stryker.floors.json: the score measured when the gates landed, raised to 95
# in each scope's own pull request, never lowered. A slow scope runs as
# several shards at once (stryker.shards.json), and a pull request retests
# only the mutants its changes reach, reusing the results of the last run on
# main; the nightly run retests everything.
#
# The text-size audit is its own workflow (tool-text-size.yml), so either can
# run, or be cancelled, without the other.
#
# "Free tools: mutation" is a REQUIRED status check on `main`. The gate job
# runs on every pull request. A pull request that changes only files no
# mutation run reads (scripts/lib/checks/check-inputs.mjs: docs/, .claude/,
# other workflows, README.md, CLAUDE.md) skips the shards and the floors, and
# the gate passes because the plan job said so, never because a job was
# skipped (owner, Nov 23, 2026). When the plan cannot tell, everything runs. Nightly and
# manual runs always run everything. Renaming the gate means changing the
# required check in the same breath (scripts/repo-hygiene.test.mjs holds the
# name).
on:
  # No branch filter, as in pr-checks.yml: a stacked pull request gets the
  # gates before it is retargeted to main.
  pull_request:
  schedule:
    # 02:17 UTC every day, away from the privacy check, deploy and newsletter.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group, so a manual run never cancels the nightly one.
concurrency:
  group: tool-mutation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'

jobs:
  # The mutation shards to run, from stryker.shards.json: a slow scope runs
  # on several runners at once (#846). And whether to run them: a pull
  # request that changes no mutation input does not (`run` is 'false').
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      run: ${{ steps.inputs.outputs.run || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base as well (HEAD^1 of the merge commit), to list what the
          # pull request changes.
          fetch-depth: 2

      - name: Whether the pull request can change a score
        id: inputs
        if: github.event_name == 'pull_request'
        # Both ends of a move (--no-renames), NUL-separated (-z) so no name
        # is quoted or split. Anything but a clear "false" runs every shard.
        run: |
          run=true
          if git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"; then
            run=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { changedPaths, needsRun } from "./scripts/lib/checks/check-inputs.mjs";
              process.stdout.write(String(needsRun(changedPaths(readFileSync(process.argv[1], "utf8")), process.argv[2])));
            ' "$RUNNER_TEMP/changed" ".github/workflows/tool-mutation.yml") || run=true
          fi
          [ "$run" = "false" ] || run=true
          if [ "$run" = "false" ]; then echo "Only files no mutation run reads changed: the shards are skipped."; else echo "Every shard runs."; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: List the shards
        id: shards
        run: |
          node -e '
            const shards = JSON.parse(require("fs").readFileSync("stryker.shards.json", "utf8"));
            const list = Object.entries(shards).flatMap(([scope, n]) =>
              Array.from({ length: n }, (_, i) => ({ scope, shard: i + 1, of: n, name: n === 1 ? scope : `${scope}-${i + 1}of${n}` })));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `shards=${JSON.stringify(list)}\n`);
          '

  mutation:
    name: 'Mutation: ${{ matrix.name }}'
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Every shard reports, so one weak tool does not hide another.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base as well, for the tests that compare with it, as in the
          # Tests job of pr-checks.yml: the first test run runs every test.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The shard's earlier results (incremental mode, #846): a pull request
      # starts from the latest run on main (the nightly one) or its own last
      # run, and retests only mutants whose code or tests changed. Stryker
      # does not see a change outside the files it mutates and the test files
      # (code a tool imports from elsewhere, the dependencies, its own
      # settings, the shards, Node, the test helpers, the data the tests
      # read), so a change to any of them, anywhere in src/ but the lessons,
      # starts the shard afresh. The nightly run retests everything
      # (STRYKER_FORCE) and saves afresh.
      - name: Earlier results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental/${{ matrix.name }}.json
          key: stryker-incremental-${{ matrix.name }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'stryker.shards.json', 'stryker.shard-weights.json', '.nvmrc', 'test/**', 'src/**', '!src/content/**') }}-${{ github.sha }}
          restore-keys: stryker-incremental-${{ matrix.name }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'stryker.shards.json', 'stryker.shard-weights.json', '.nvmrc', 'test/**', 'src/**', '!src/content/**') }}-

      # Fails on a failed first test run and on a shard that finds nothing
      # to mutate. The score is judged in the floors job, over all shards.
      - name: Mutation testing of ${{ matrix.name }}
        env:
          STRYKER_SCOPE: ${{ matrix.scope }}
          STRYKER_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
          STRYKER_CONCURRENCY: '4'
          STRYKER_FORCE: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          NEWSLETTER_ID_BASE: HEAD^1
          PRIVACY_NOTICE_BASE: HEAD^1
          FLOORS_BASE: HEAD^1
        run: npx stryker run stryker.config.mjs

      # Incremental mode also writes earlier results for mutants outside this
      # shard; left in, a mutant that moved shards would be counted twice.
      - name: Keep only this shard's mutants
        env:
          STRYKER_SCOPE: ${{ matrix.scope }}
          STRYKER_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: node scripts/mutation-shard-report.mjs

      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.name }}
          path: reports/mutation/${{ matrix.name }}.json
          retention-days: 14
          if-no-files-found: error

  # The gate: each scope's logic and its component(s), over all its shards,
  # each at or above its floor in stryker.floors.json. A floor only rises, to
  # 95 (#790).
  floors:
    needs: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: The shards' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: reports/mutation
          merge-multiple: true

      - name: Scores at or above their floors
        run: |
          failed=0
          for scope in $(node -p 'Object.keys(JSON.parse(require("fs").readFileSync("stryker.shards.json", "utf8"))).join(" ")'); do
            node scripts/mutation-floors.mjs "$scope" || failed=1
          done
          exit $failed

  # The required check. It passes only when every job above passed.
  #
  # `always()` matters: a skipped job satisfies a required check. Without a
  # status function GitHub skips this job when a job it needs has failed, and
  # `!cancelled()` skips it when the run is cancelled before it starts; either
  # way a gate that did not pass would read as a pass. With `always()` it runs
  # every time and passes only when every job above succeeded.
  gate:
    name: 'Free tools: mutation'
    needs: [plan, mutation, floors]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          PLAN: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          MUTATION: ${{ needs.mutation.result }}
          FLOORS: ${{ needs.floors.result }}
        run: |
          echo "plan: $PLAN (run: $RUN), mutation: $MUTATION, floors: $FLOORS"
          # A pull request that changes no mutation input: the plan said so,
          # and nothing ran. Only that exact case passes without the shards.
          if [ "$PLAN" = "success" ] && [ "$RUN" = "false" ] && [ "$MUTATION" = "skipped" ] && [ "$FLOORS" = "skipped" ]; then
            echo "No mutation input changed: nothing to test."
            exit 0
          fi
          if [ "$PLAN" != "success" ] || [ "$MUTATION" != "success" ] || [ "$FLOORS" != "success" ]; then
            echo "::error::Free tools mutation testing did not pass (or did not run). See the jobs above."
            exit 1
          fi

  # Nobody watches the nightly run, so one that failed or was cancelled opens
  # an issue, or adds to the one already open.
  alert:
    needs: [plan, mutation, floors, gate]
    if: github.event_name == 'schedule' && (failure() || (!cancelled() && contains(needs.*.result, 'cancelled')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write   # open or comment on the tool-gates-alert issue
    steps:
      - name: Open or update the tool-gates-alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          TITLE="Nightly free tools mutation testing did not pass ($(date -u +%Y-%m-%d))"
          BODY="$RUNNER_TEMP/tool-gates-alert.md"
          {
            echo "The nightly run of the free tools mutation testing did not finish green."
            echo
            echo "- Workflow run: $RUN_URL (attempt $ATTEMPT)"
            echo
            echo "Open the run to see which job failed. Close the issue once a nightly run has passed. While it is open, further failures are added here as comments."
          } > "$BODY"
          EXISTING=$(gh issue list --state open --label tool-gates-alert --limit 1 --json number --jq '.[0].number // empty' || echo "")
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY"
          else
            gh issue create --title "$TITLE" --label tool-gates-alert --body-file "$BODY" || {
              gh label create tool-gates-alert --color D93F0B --description "The nightly free tools gates did not pass" || true
              gh issue create --title "$TITLE" --label tool-gates-alert --body-file "$BODY"
            }
          fi
