name: Newsletter pipeline

# Sends newsletter emails for newly-published posts and scans the
# FROM_EMAIL inbox for bounces. Completely decoupled from the deploy
# workflow — a failure here never delays or blocks a site deploy.
#
# How this workflow gets triggered:
#   1. Automatically, ~45s after every successful `Deploy to GitHub Pages`
#      run, via the `trigger-newsletter` job in deploy.yml. The delay is
#      intentional — it gives the GitHub Pages CDN time to make the new
#      /rss.xml globally visible before we fetch it. See deploy.yml for
#      the reasoning.
#   2. Manually, from the Actions tab → "Newsletter pipeline" → Run
#      workflow. Useful for retrying a failed send or triggering a
#      bounce scan on demand.
#   3. On a daily cron, as a safety net — if deploy happens to be broken
#      on a given day, the bounce scan still runs and any unsent posts
#      from previous runs are retried.
#
# The newsletter content itself comes from the DEPLOYED site (not a local
# build): we fetch https://nidhi.today/rss.xml and the HTML of each new
# post directly. This guarantees subscribers receive exactly what's live
# on the web at send time — no "the email mentions content that the site
# doesn't have yet" skew. See NEWSLETTER_FETCH_LIVE in send_newsletter.py.

on:
  workflow_dispatch:
    inputs:
      only_most_recent:
        description: "Send only the newest unsent post (SEND_ONLY_MOST_RECENT=1)"
        type: boolean
        default: false
      skip_bounce_scan:
        description: "Skip the mailer-daemon inbox scan"
        type: boolean
        default: false
  schedule:
    # Daily safety-net run at 07:30 UTC. Independent from (and after) the
    # deploy cron at 06:03 UTC + its 45s hand-off, so this won't collide
    # under normal operation — but if a deploy fails for the day, this
    # still gives us a daily bounce scan and a chance to pick up any
    # partial-send resumes.
    - cron: '03 7 * * *'

permissions:
  contents: write   # commit .last-sent-guid.txt to newsletter-state
  issues: write     # open failure-notification issues

concurrency:
  group: newsletter
  # Never cancel an in-flight send mid-fan-out — we'd lose recipients
  # between the Apps Script's progress marker and the Python marker file.
  # Queue instead: back-to-back triggers run sequentially.
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # Newsletter secrets + shared config live at JOB level (not workflow
    # level) so they're reliably available to step-level `if:` expressions
    # via the `env` context. GitHub Actions does not allow `secrets.X` in
    # `if:` directly — going through `env` is the documented workaround.
    #
    # NEWSLETTER_ENDPOINT is read from `secrets.PUBLIC_NEWSLETTER_ENDPOINT`
    # — the same URL the browser uses. We use one secret for both the
    # build-time baked-into-JS endpoint and the server-side workflow
    # endpoint, because it's literally the same Apps Script `/exec` URL
    # and is already public by design (every page's JS references it).
    # The `PUBLIC_` prefix is just Astro/Vite convention for
    # "exposed at build time"; it has no bearing on Actions secret scoping.
    #
    # NEWSLETTER_HMAC_SECRET is a genuinely separate secret — a shared
    # signing key proving to Apps Script that send_post / scan_bounces
    # requests came from our CI and not from someone who saw the public
    # endpoint URL.
    env:
      NEWSLETTER_ENDPOINT: ${{ secrets.PUBLIC_NEWSLETTER_ENDPOINT }}
      NEWSLETTER_HMAC_SECRET: ${{ secrets.NEWSLETTER_HMAC_SECRET }}
      SITE_URL: https://nidhi.today
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --upgrade 'beautifulsoup4>=4.12' 'jinja2>=3.1'

      - name: Check newsletter configuration
        # Explicit preflight so a missing secret produces a visible
        # diagnostic in the Actions log instead of silently cascading into
        # four skipped steps and zero signal about what's wrong.
        # Sets `configured=true|false` as a step output that every
        # subsequent gated step depends on. Never touches secret values
        # directly in echo — only presence checks, so nothing leaks.
        id: preflight
        run: |
          set -e
          OK=1
          if [ -z "${NEWSLETTER_ENDPOINT:-}" ]; then
            echo "::warning title=Missing secret::PUBLIC_NEWSLETTER_ENDPOINT is not configured. Add it under Settings → Secrets and variables → Actions → Secrets (same URL the site build uses). See docs/blog-subscription-setup.md."
            OK=0
          else
            echo "PUBLIC_NEWSLETTER_ENDPOINT: configured"
          fi
          if [ -z "${NEWSLETTER_HMAC_SECRET:-}" ]; then
            echo "::warning title=Missing secret::NEWSLETTER_HMAC_SECRET is not configured. Add it under Settings → Secrets and variables → Actions → Secrets. See docs/blog-subscription-setup.md."
            OK=0
          else
            # Length is the cheapest and most useful mismatch signal.
            # `openssl rand -hex 32` produces exactly 64 hex chars; any
            # other length means something went wrong during copy/paste
            # (trailing newline, extra space, truncated value). The
            # number itself is not the secret so GitHub's log masking
            # doesn't hide it.
            #
            # Pair with the Apps Script debugHmacSecret() function: if
            # both sides report 64 but bad_signature still happens,
            # compare the HMAC of the literal string "secret-check"
            # from both sides — they'll match iff the secrets match.
            # That string signs nothing: no action accepts it, so the
            # value can sit in a public log. Never print a signature
            # that an action accepts.
            LEN=${#NEWSLETTER_HMAC_SECRET}
            SIG_PROBE=$(printf 'secret-check' \
              | openssl dgst -sha256 -hmac "$NEWSLETTER_HMAC_SECRET" \
              | awk '{print $NF}')
            echo "NEWSLETTER_HMAC_SECRET: configured (length=$LEN, expected=64)"
            echo "HMAC(\"secret-check\", secret) = $SIG_PROBE"
            echo "  ↳ Run debugHmacSecret() in the Apps Script editor."
            echo "     Matching output means the two secrets are byte-identical."
            if [ "$LEN" != "64" ]; then
              echo "::warning title=Unexpected secret length::NEWSLETTER_HMAC_SECRET is $LEN characters, expected 64. Likely a copy-paste included extra whitespace. Regenerate with 'openssl rand -hex 32' and paste carefully."
            fi
          fi
          if [ "$OK" = "1" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✓ Newsletter pipeline is fully configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Newsletter pipeline will be skipped::One or more required secrets are missing. All subsequent steps (send, commit marker, scan bounces, notify) will be skipped. Fix by adding the secrets flagged above."
          fi

      - name: Load newsletter marker
        # The record of sent posts lives on `newsletter-state` (see the commit
        # step below). The copy on `main` only seeds that branch on its first
        # run. If this fetch ever fails, the older copy is safe to use: Apps
        # Script keeps its own `sent_guid:` record and skips posts already sent.
        if: steps.preflight.outputs.configured == 'true'
        run: |
          if git fetch --depth=1 origin "+refs/heads/newsletter-state:refs/remotes/origin/newsletter-state" 2>/dev/null; then
            git show origin/newsletter-state:.last-sent-guid.txt > .last-sent-guid.txt
            echo "Marker loaded from newsletter-state."
          else
            echo "No newsletter-state branch yet: using the marker on main."
          fi

      - name: Send newsletter for new posts
        id: newsletter
        if: steps.preflight.outputs.configured == 'true'
        env:
          # Live-fetch mode: read /rss.xml and per-post HTML over HTTPS
          # directly from the deployed site. No `npm run build` in this
          # workflow — the Astro project's source tree isn't even needed
          # for rendering, only the emails/ templates and the script.
          NEWSLETTER_FETCH_LIVE: '1'
          MARKER_FILE: ${{ github.workspace }}/.last-sent-guid.txt
          BACKFILL_OK: ${{ vars.NEWSLETTER_BACKFILL_OK }}
          # Inputs only exist on workflow_dispatch; fall back to '' on
          # schedule / other triggers. The script treats empty as "off".
          SEND_ONLY_MOST_RECENT: ${{ (github.event.inputs.only_most_recent == 'true' && '1') || '' }}
        run: python scripts/send_newsletter.py
        continue-on-error: true

      - name: Commit updated newsletter marker
        # Pushes .last-sent-guid.txt to the unprotected `newsletter-state`
        # branch using the default GITHUB_TOKEN (made available by
        # `persist-credentials: true` on the checkout step above). It cannot go
        # to `main`: the required status checks there reject direct pushes,
        # which failed this step from Oct 2026 on. No workflow runs on a push
        # to `newsletter-state`, so this never triggers a deploy.
        #
        # The worktree keeps the checkout untouched. Lines already on the
        # branch are kept, so a concurrent run's record is not overwritten.
        id: marker
        if: steps.newsletter.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATE="$RUNNER_TEMP/newsletter-state"
          for attempt in 1 2 3; do
            rm -rf "$STATE"
            git worktree prune
            if git fetch --depth=1 origin "+refs/heads/newsletter-state:refs/remotes/origin/newsletter-state" 2>/dev/null; then
              git worktree add --detach "$STATE" origin/newsletter-state
            else
              git worktree add --detach "$STATE" HEAD
            fi
            grep -vxFf "$STATE/.last-sent-guid.txt" .last-sent-guid.txt >> "$STATE/.last-sent-guid.txt" || true
            if git -C "$STATE" diff --quiet -- .last-sent-guid.txt && git rev-parse --verify --quiet origin/newsletter-state >/dev/null; then
              echo "No marker changes to commit."
              exit 0
            fi
            git -C "$STATE" add .last-sent-guid.txt
            git -C "$STATE" commit --allow-empty -m "chore(newsletter): record sent post GUIDs"
            if git -C "$STATE" push origin HEAD:refs/heads/newsletter-state; then
              echo "Marker pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "::error::Failed to push newsletter marker to newsletter-state after 3 attempts."
          exit 1

      - name: Scan for newsletter bounces
        # Asks Apps Script to read Google's delivery failure reports in the
        # FROM_EMAIL inbox from the last 14 days and flip the rows they
        # name to status=bounced. Idempotent — safe to run multiple times.
        # Signed with HMAC-SHA256(HMAC_SECRET, "scan_bounces:<unix time>");
        # the time goes along as `ts` and the signature is good for five
        # minutes, so one read from a log later opens nothing (see
        # verifyScanBouncesSig_). The address is not echoed for the same
        # reason.
        id: bounce_scan
        if: >-
          always() &&
          steps.preflight.outputs.configured == 'true' &&
          github.event.inputs.skip_bounce_scan != 'true'
        run: |
          set -euo pipefail
          TS=$(date +%s)
          SIG=$(printf 'scan_bounces:%s' "$TS" \
                | openssl dgst -sha256 -hmac "$NEWSLETTER_HMAC_SECRET" \
                | awk '{print $NF}')
          SEP='?'
          case "$NEWSLETTER_ENDPOINT" in *\?*) SEP='&' ;; esac
          URL="${NEWSLETTER_ENDPOINT}${SEP}action=scan_bounces&ts=${TS}&sig=${SIG}"
          echo "Scanning bounces…"
          RESP=$(curl -sSL --max-time 120 "$URL" || true)
          echo "Response: $RESP"
          # Best-effort parse; don't fail the run if Apps Script is flaky,
          # just surface a warning. Next run will try again.
          if ! echo "$RESP" | grep -q '"ok":true'; then
            echo "::warning::bounce scan did not return ok=true"
          fi
        continue-on-error: true

      - name: Notify on newsletter failure
        # Opens (or comments on an existing daily) GitHub Issue labeled
        # `newsletter-alert` when the newsletter pipeline did anything
        # other than cleanly succeed. Because this workflow is decoupled
        # from deploy, the Actions UI's "workflow status" for deploys
        # no longer reflects newsletter health — the issue is the primary
        # push-based alert.
        #
        # Skip when the step was skipped (missing secrets in a fresh
        # setup) — no work was attempted, nothing to alert on.
        if: >-
          always() &&
          steps.newsletter.outcome != 'skipped' &&
          (
            steps.newsletter.outcome == 'failure' ||
            steps.marker.outcome == 'failure' ||
            steps.newsletter.outputs.any_failed == '1' ||
            (steps.newsletter.outputs.total_failed != '' && steps.newsletter.outputs.total_failed != '0') ||
            (steps.newsletter.outputs.total_partial != '' && steps.newsletter.outputs.total_partial != '0')
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.newsletter.outcome }}
          MARKER_OUTCOME: ${{ steps.marker.outcome }}
          ANY_FAILED: ${{ steps.newsletter.outputs.any_failed }}
          TOTAL_SENT: ${{ steps.newsletter.outputs.total_sent }}
          TOTAL_FAILED: ${{ steps.newsletter.outputs.total_failed }}
          TOTAL_PARTIAL: ${{ steps.newsletter.outputs.total_partial }}
          POSTS_ATTEMPTED: ${{ steps.newsletter.outputs.posts_attempted }}
        run: |
          set -euo pipefail
          TITLE="Newsletter send needs attention ($(date -u +%Y-%m-%d))"
          # De-dupe: one open issue per UTC day, so a cron-triggered retry
          # that also fails just adds a comment rather than spamming a new
          # issue.
          EXISTING=$(gh issue list --state open --label newsletter-alert \
            --search "$TITLE in:title" --json number --jq '.[0].number' || echo "")

          BODY=$(cat <<EOF
          The newsletter step finished with issues. Please investigate.

          | | |
          |---|---|
          | Step outcome | \`$OUTCOME\` |
          | Marker push | \`${MARKER_OUTCOME:-?}\` |
          | Posts attempted | \`${POSTS_ATTEMPTED:-?}\` |
          | Total sent | \`${TOTAL_SENT:-?}\` |
          | Total failed | \`${TOTAL_FAILED:-?}\` |
          | Partial responses | \`${TOTAL_PARTIAL:-?}\` |
          | any_failed flag | \`${ANY_FAILED:-?}\` |

          - Workflow run: $RUN_URL
          - Apps Script executions: https://script.google.com (Executions pane)
          - Health check: \`curl -sL "\$PUBLIC_NEWSLETTER_ENDPOINT?action=health" | jq\`

          **What to check first**
          1. If \`outcome\` is anything but \`success\`, read the step log.
          2. If \`total_partial > 0\`, the next run should resume automatically — the guid was NOT written to .last-sent-guid.txt. Just re-run this workflow from the Actions tab.
          3. If \`total_failed > 0\` but \`total_sent > 0\`, inspect PostHog for \`blog_newsletter_send_failed\` events (grouped by email_domain).
          4. If the health check's \`from_email_sendable.ok\` is false, the "Send mail as" alias in Gmail was removed. Re-add it.
          EOF
          )

          if [ -n "${EXISTING:-}" ]; then
            echo "Appending to existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening new issue"
            gh issue create \
              --title "$TITLE" \
              --label newsletter-alert \
              --body "$BODY" || {
                # If the label doesn't exist yet, create it and retry once.
                gh label create newsletter-alert --color D93F0B --description "Newsletter pipeline failures" || true
                gh issue create --title "$TITLE" --label newsletter-alert --body "$BODY"
              }
          fi
