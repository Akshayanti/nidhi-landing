name: PR Checks
on:
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toy
        id: toy
        run: bash .github/toy.sh "changes" "${{ matrix.name || matrix.tool || '' }}"
  install:
    name: Install (lockfile integrity)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toy
        id: toy
        run: bash .github/toy.sh "install" "${{ matrix.name || matrix.tool || '' }}"
  validation:
    name: ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Lint
            timeout: 10
          - name: Type check
            timeout: 10
          - name: Tests
            timeout: 15
            fetch-depth: 2
          - name: npm audit (high+)
            timeout: 10
          - name: Remotion
            timeout: 10
            lockfile: remotion/package-lock.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toy
        id: toy
        run: bash .github/toy.sh "validation" "${{ matrix.name || matrix.tool || '' }}"
  build:
    name: Build (static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toy
        id: toy
        run: bash .github/toy.sh "build" "${{ matrix.name || matrix.tool || '' }}"
  tools:
    name: "Tool stage: ${{ matrix.suite }}"
    needs: build
    strategy:
      fail-fast: true
      matrix:
        suite:
          - privacy
          - mutation
          - text-size
    uses: ./.github/workflows/tool-suite.yml
    with:
      suite: ${{ matrix.suite }}
  privacy:
    name: No typed value reaches analytics
    needs: tools
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The tool stage passed
        env:
          TOOLS: ${{ needs.tools.result }}
        run: |
          echo "tool stage: $TOOLS"
          if [ "$TOOLS" != "success" ]; then
            echo "::error::The free tools did not all pass (or did not run). See the 'Tool stage: privacy' jobs, or the stage that failed before them."
            exit 1
          fi
  mutation:
    name: "Free tools: mutation"
    needs: tools
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The tool stage passed
        env:
          TOOLS: ${{ needs.tools.result }}
        run: |
          echo "tool stage: $TOOLS"
          if [ "$TOOLS" != "success" ]; then
            echo "::error::The free tools did not all pass (or did not run). See the 'Tool stage: mutation' jobs, or the stage that failed before them."
            exit 1
          fi
  text-size:
    name: "Free tools: text size"
    needs: tools
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The tool stage passed
        env:
          TOOLS: ${{ needs.tools.result }}
        run: |
          echo "tool stage: $TOOLS"
          if [ "$TOOLS" != "success" ]; then
            echo "::error::The free tools did not all pass (or did not run). See the 'Tool stage: text-size' jobs, or the stage that failed before them."
            exit 1
          fi
