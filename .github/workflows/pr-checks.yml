name: PR Checks (free tools)

# Runs the install, lint, type check, test, audit, and build gates whenever a
# PR touches files that power the site's tools, pages, lessons or build.
# Unrelated PRs (plans and docs, for example) don't pay the cost of running the
# full suite. A separate "Remotion" job checks the reel renderer when a PR
# touches remotion/.
#
# Every job is a REQUIRED status check on `main` (Settings -> Branches). That
# is why the path filter lives in the "Detect changes" job below rather than
# under `on.pull_request.paths`: a workflow that a path filter stops from
# starting never reports, and GitHub then waits for its required checks
# forever, blocking the merge. A job skipped by `if:` reports "skipped", which
# satisfies a required check. Required checks, by job name:
#   Detect changes, Install (lockfile integrity), Lint, Type check, Tests,
#   npm audit (high+), Build (static), Remotion (required from Nov 2026,
#   council round 20). Renaming or removing a job means changing that list
#   in the same breath, or every PR waits for a check that never reports.
# One more required check lives in tool-privacy.yml: No typed value reaches
# analytics (required from Nov 2026), skipped the same way when a PR touches
# no tool or analytics file.
#
# The Hindi edition is built as a stack of PRs: each one targets the branch
# below it (`hindi/01-...`, `hindi/02-...`, ...) and the last targets
# `feat/hindi-locale`, the integration branch, which merges to `main` once the
# whole edition is ready. A stacked PR's base is another feature branch, not
# `main`, so without these entries every PR in the stack would merge with no CI
# at all. `hindi/*` covers the stack as it grows; `feat/hindi-locale` and `main`
# cover the two branches that end it.
on:
  pull_request:
    branches: [main, feat/hindi-locale, 'hindi/*']
  # Allow manual runs for debugging.
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same PR cancels the previous in-flight run.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Install scripts: every `npm ci` here fails if a dependency has an install
# script that the project's package.json `allowScripts` does not cover (for
# example a puppeteer bump whose pinned approval has not been updated). Only
# CI is strict: in .npmrc it would stop Dependabot from opening those PRs at
# all. See README "Install scripts".
env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # Which files the PR touches. The other jobs run only when one of them
  # matches a pattern here (a manual run always runs everything). Patterns are
  # bash globs, where `*` also matches `/`, so `src/utils/loan/*` covers the
  # whole tree under it.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
      remotion: ${{ steps.filter.outputs.remotion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The PR's merge commit and its first parent, the base it merges
          # into, so `HEAD^1 HEAD` is exactly what the PR changes.
          fetch-depth: 2

      - name: Match changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "remotion=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          patterns=(
            # The /free/* pages and any utility/component they pull in.
            'src/pages/free/*'
            'src/pages/privacy.astro'
            'src/components/pages/PrivacyPage.astro'
            'src/components/LoanCompare.tsx'
            'src/components/MultiCurrencyNetWorth.tsx'
            'src/components/MonteCarloSimulator.tsx'
            'src/components/ToolStateGuard.astro'
            'src/components/chart/*'
            # The header carries a tool's state across a language switch, and the
            # helpers both sides use live in shared utils.
            'src/components/Header.astro'
            'src/components/LangPicker.astro'
            'src/components/Analytics.astro'
            # The inflation calculator's World Bank data, refreshed monthly by
            # inflation-data.yml in a pull request that should run the suite.
            'src/data/*'
            # Global type declarations the type check reads.
            'src/types/*'
            # Every utility and its tests: the tools' math and URL state, the
            # shared helpers, the glossary and home helpers, the dependency
            # snapshot. One glob, because the list of subdirectories it replaced
            # (Nov 2026) had fallen behind: glossary.mjs, home/ and
            # invest-or-pay-off/ were tested but never triggered the checks.
            'src/utils/*'
            'scripts/*'
            # IndexNow build-pipeline tooling. A bad edit to indexnow.mjs
            # would silently break the deploy workflow's post-deploy step;
            # gating it on the same checks the rest of the deploy depends on
            # is the cheapest way to catch regressions before merge.
            'scripts/indexnow.mjs'
            'scripts/indexnow.test.mjs'
            # Anything that affects the build or dep graph.
            'package.json'
            'package-lock.json'
            'astro.config.mjs'
            'tsconfig.json'
            # The lint script and this workflow itself.
            'scripts/lint.mjs'
            'scripts/lint-figures.mjs'
            '.github/workflows/pr-checks.yml'
            # Site-wide base components and public assets that affect every page.
            'src/components/BaseHead.astro'
            'src/layouts/*'
            # Page bodies. Since the Hindi edition, a page's markup lives in a
            # component here and `src/pages/` holds only the thin routes that render
            # it, so a PR that edits a page's copy or layout touches this directory
            # and nothing else. Without the glob those PRs would merge with no CI at
            # all, which is the opposite of what this workflow is for.
            'src/components/pages/*'
            # String catalogs and locale plumbing. Every page reads from them, and
            # the test job's catalog tests live here, so a copy fix that touches
            # nothing else still gets the suite run over it.
            'src/i18n/*'
            'public/robots.txt'
            'public/llms.txt'
            # Everything else the build compiles. Once these checks are
            # required, a skipped run counts as a pass, so any file that can
            # break the build has to be listed: every route (including the
            # `[locale]` mirror), every component and style, the content
            # schema and the public assets.
            'src/pages/*'
            'src/components/*'
            'src/styles/*'
            'src/content.config.ts'
            'public/*'
            # Lessons. They were left out once, on the grounds that the deploy
            # builds them anyway, but the build leaves out lessons dated in the
            # future, so a mistake in a scheduled lesson surfaced only on its
            # publish day, as a failed deploy. Here the type check validates
            # every lesson's frontmatter (astro sync), and the tests read every
            # lesson file, future-dated ones included (Nov 2026).
            'src/content/*'
          )
          run=false
          remotion=false
          while IFS= read -r file; do
            # The reel renderer has its own package and lockfile, checked by
            # the Remotion job, not by the site's.
            if [[ "$file" == remotion/* ]]; then
              echo "remotion: $file"
              remotion=true
              continue
            fi
            if [ "$run" = true ]; then continue; fi
            for pattern in "${patterns[@]}"; do
              # Unquoted on purpose: the pattern is a glob.
              if [[ "$file" == $pattern ]]; then
                echo "matched: $file ($pattern)"
                run=true
                break
              fi
            done
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "remotion=$remotion" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Lockfile + dependency integrity. `npm ci` fails fast if package.json and
  # package-lock.json disagree, which is the cheapest possible signal to
  # surface for any dep change.
  # ---------------------------------------------------------------------------
  install:
    name: Install (lockfile integrity)
    runs-on: ubuntu-latest
    # Every other job needs this one, so when it is skipped they are skipped
    # too, and all of them report "skipped" to branch protection.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (strict)
        # `npm ci` errors out if package.json and package-lock.json diverge,
        # so a PR that bumps a version in one but not the other is rejected
        # before any other check runs.
        run: npm ci

  # ---------------------------------------------------------------------------
  # Static / code-quality lint. Custom Node script, zero new deps.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Type check of every .ts and .tsx file. The string catalogs are typed as one
  # shape (`Dict`), and the islands take their copy as typed props, so this is
  # what catches a missing key or a component reading text it was never given
  # (the loan comparison's Refinance tab once shipped reading an undefined
  # `strings`, which throws in the browser). `astro sync` writes the content
  # collection types the check reads. Astro templates are not covered.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Unit tests + dependency-snapshot test. The snapshot test fails any PR
  # that adds, removes, or version-bumps a dep without updating the inline
  # EXPECTED_* maps in src/utils/dependencies.test.ts, making dep changes
  # an explicit, code-reviewable event.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test

      # The newsletter script is Python, so npm test does not reach it. Same
      # dependency pins as the newsletter.yml send step.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run newsletter tests
        run: |
          pip install --upgrade 'beautifulsoup4>=4.12' 'jinja2>=3.1'
          python -m unittest scripts/test_send_newsletter.py
          python -m unittest scripts/test_newsletter_sender.py

      # The QR code generator for print material (standard library only).
      - name: Run QR code tests
        run: python -m unittest scripts/test_qr_svg.py

  # ---------------------------------------------------------------------------
  # Vulnerability audit. Lets a freshly-introduced known-vulnerable
  # transitive dep block the merge.
  # ---------------------------------------------------------------------------
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit
        # Only fail on `high` and `critical`. `npm audit` is noisy in the
        # JS ecosystem and lower-severity findings often have no available
        # fix; gating on every advisory leads to dismissal fatigue.
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # Final build. Catches any regressions that only surface during the static
  # build (Astro template errors, broken imports, missing assets, etc.).
  # ---------------------------------------------------------------------------
  build:
    name: Build (static)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, audit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # The reel renderer (remotion/): its own package.json and lockfile. Runs only
  # when a PR touches remotion/, Dependabot's Remotion bumps included. It
  # installs strictly and type-checks; it renders nothing, since that needs a
  # browser download and a real reel plan (the layout guard rejects the
  # composition's placeholder props). No npm audit: Remotion never reaches
  # readers, which is also why the site's audit uses --omit=dev.
  # ---------------------------------------------------------------------------
  remotion:
    name: Remotion
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.remotion == 'true'
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install (strict)
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .
